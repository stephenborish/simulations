<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Opening your link…</title>
  <style>
    body { font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:#241b36;
      display:grid; place-items:center; min-height:100vh; min-height:100svh; margin:0; background:#f9f6ff; }
    main { padding:35px; max-width:450px; text-align:center; }
    .spinner { width:28px; height:28px; border:3px solid #e1d8ed;
      border-top-color:#63439a; border-radius:50%; animation:turn .7s linear infinite; margin:0 auto 18px; }
    @keyframes turn { to { transform:rotate(360deg); } }
    h1 { font-size:23px; margin:0 0 8px; }
    p { color:#6b6176; margin:0; }
    a { color:#56338d; font-weight:700; }
  </style>
</head>
<body>
<main>
  <div class="spinner" id="spinner" aria-hidden="true"></div>
  <h1 id="title">Opening your link…</h1>
  <p id="status" role="status">Selecting your destination.</p>
  <p id="manual" style="margin-top:18px" hidden><a id="destination" href="#">Continue to destination</a></p>
</main>
<script>
  'use strict';

  // REQUIRED: Replace this placeholder with your Apps Script web app /exec URL.
  // Example: https://script.google.com/macros/s/AKfycbXXXXXXXX/exec
  const API_URL = 'https://script.google.com/macros/s/AKfycbw08OaJ9eNqtLfpmghn5Jex9L1GgiY30BhhFEYaWQ32YKAIid09ndgSheF0VBNf4xe3/exec';

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('r') || params.get('slug') || '';
  let finished = false;
  let timer;

  function fail(text) {
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    document.getElementById('spinner').hidden = true;
    document.getElementById('title').textContent = 'Could not open this link';
    document.getElementById('status').textContent = text;
    const retry = document.getElementById('manual');
    document.getElementById('destination').textContent = 'Try again';
    document.getElementById('destination').href = window.location.href;
    retry.hidden = false;
  }

  function resolved(result) {
    if (finished) return;
    if (result && result.ok === false && result.retry && attempt < MAX_ATTEMPTS) {
      schedule(1500); // transient server error: wait and retry with the same token
      return;
    }
    clearTimeout(timer);
    if (!result || !result.ok || typeof result.url !== 'string') {
      fail((result && result.error) || 'The requested link is unavailable.');
      return;
    }
    let destination;
    try {
      destination = new URL(result.url);
      if (!['https:', 'http:'].includes(destination.protocol)) throw new Error('Unsafe URL');
    } catch (err) {
      fail('The destination URL is invalid.');
      return;
    }
    finished = true;
    document.getElementById('destination').textContent = 'Continue to destination';
    document.getElementById('destination').href = destination.href;
    document.getElementById('manual').hidden = false;
    document.getElementById('status').textContent = 'Destination selected. If you are not redirected, click below.';
    window.location.replace(destination.href);
  }

  // Fallback JSONP callback (the Apps Script response calls this fixed name).
  window.redirectResolved = resolved;

  // One random token per page load so server-side retries are idempotent.
  const token = (function() {
    try {
      const b = new Uint8Array(12);
      crypto.getRandomValues(b);
      return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    }
  })();

  function buildUrl() {
    const url = new URL(API_URL);
    url.searchParams.set('action', 'resolve');
    url.searchParams.set('r', slug);
    url.searchParams.set('t', token); // Same token on every retry => same destination, counted once.
    url.searchParams.set('_t', String(Date.now())); // Defeat HTTP caching of the response.
    return url.href;
  }

  // Script-tag (JSONP) request: the proven path. Any attempt that answers first wins
  // (late answers from earlier attempts are also accepted via the shared callback).
  const MAX_ATTEMPTS = 5;
  const ATTEMPT_MS = 15000;
  let attempt = 0;

  function tryOnce() {
    if (finished) return;
    attempt++;
    const script = document.createElement('script');
    script.src = buildUrl();
    script.async = true;
    script.onerror = () => { script.remove(); schedule(1500); };
    document.head.append(script);
    schedule(ATTEMPT_MS);
  }

  function schedule(ms) {
    clearTimeout(timer);
    if (finished) return;
    timer = setTimeout(() => {
      if (attempt >= MAX_ATTEMPTS) {
        fail('The redirect service is busy. Please tap "Try again".');
      } else {
        document.getElementById('status').textContent = 'Still working… please wait.';
        tryOnce();
      }
    }, ms);
  }

  if (!/^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/.test(slug)) {
    fail('This link is missing a valid redirect ID.');
  } else if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)) {
    fail('The redirect service has not been configured yet.');
  } else {
    tryOnce();
  }
</script>
</body>
</html>
