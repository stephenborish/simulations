trons."},{"skill":"neutrons","question":"Two atoms both have 6 protons, but one has 6 neutrons and one has 7. What are these called?","options":["Ions","Isotopes","Isomers","Different elements"],"correct":1,"explanation":"Same protons, different neutrons = Isotopes (like Carbon-12 and Carbon-13)."},{"skill":"valence","question":"What are valence electrons?","options":["All electrons in an atom","Electrons in the innermost shell","Electrons in the outermost shell","Electrons in the nucleus"],"correct":2,"explanation":"Valence electrons are in the outermost shell - they're the ones that bond!"},{"skill":"valence","question":"Elements in Group 1 have how many valence electrons?","options":["1","2","7","8"],"correct":0,"explanation":"Neutral group 1 atoms have 1 valence electron. For groups 1 and 2, use the group number."},{"skill":"valence","question":"Chlorine is in Group 17. How many valence electrons does it have?","options":["1","7","8","17"],"correct":1,"explanation":"Group 17 = 7 valence electrons. (For groups 13-18, subtract 10.)"},{"skill":"valence","question":"Silicon is in Group 14. How many valence electrons does it have?","options":["2","4","10","14"],"correct":1,"explanation":"Group 14 - 10 = 4 valence electrons."},{"skill":"valence","question":"An element has 2 electrons in shell 1 and 5 electrons in shell 2. What group is it in?","options":["Group 2","Group 5","Group 7","Group 15"],"correct":3,"explanation":"5 valence electrons correspond to group 15. Use the last digit of 15."},{"skill":"shells","question":"What is the maximum number of electrons Shell 1 can hold?","options":["1","2","8","18"],"correct":1,"explanation":"Shell 1 can hold a maximum of 2 electrons."},{"skill":"shells","question":"Which shell fills with electrons first?","options":["The outermost shell","Shell 1 (innermost)","Shell 2","Any shell randomly"],"correct":1,"explanation":"Electrons fill from the inside out - Shell 1 first!"},{"skill":"shells","question":"Oxygen has 8 electrons. How are they arranged in shells?","options":["8 in Shell 1","2 in Shell 1, 6 in Shell 2","4 in Shell 1, 4 in Shell 2","6 in Shell 1, 2 in Shell 2"],"correct":1,"explanation":"Shell 1 fills first (max 2), then remaining 6 go to Shell 2."},{"skill":"shells","question":"Sodium has 11 electrons. What's the arrangement?","options":["2, 8, 1","2, 9, 0","11, 0, 0","2, 2, 7"],"correct":0,"explanation":"Shell 1: 2, Shell 2: 8 (full), Shell 3: 1 remaining = 2, 8, 1"},{"skill":"shells","subtype":"electron-placement","question":"Place the electrons correctly for CARBON (6 electrons).","target":{"shell1":2,"shell2":4,"shell3":0,"total":6},"explanation":"Carbon: 2 electrons in Shell 1, 4 electrons in Shell 2."},{"skill":"shells","subtype":"electron-placement","question":"Place the electrons correctly for NEON (10 electrons).","target":{"shell1":2,"shell2":8,"shell3":0,"total":10},"explanation":"Neon has 2 electrons in shell 1 and 8 in shell 2. This arrangement is associated with its low chemical reactivity."},{"skill":"charge","question":"A neutral atom has equal numbers of which particles?","options":["Protons and neutrons","Protons and electrons","Neutrons and electrons","All three are equal"],"correct":1,"explanation":"Neutral = protons (+) equal electrons (-). Charges cancel out!"},{"skill":"charge","question":"What is the charge of a proton?","options":["-1","0","+1","+2"],"correct":2,"explanation":"Protons have a +1 positive charge."},{"skill":"charge","question":"An atom has 11 protons and 10 electrons. What is its charge?","options":["-1","0","+1","+11"],"correct":2,"explanation":"Net charge = number of protons − number of electrons. 11 − 10 = +1."},{"skill":"charge","question":"An atom has 9 protons and 10 electrons. What is its charge?","options":["-1","0","+1","-10"],"correct":0,"explanation":"9 protons - 10 electrons = -1 charge."},{"skill":"charge","question":"Calcium (20 protons) forms a +2 ion. How many electrons does it have?","options":["18","20","22","2"],"correct":0,"explanation":"+2 charge means it lost 2 electrons: 20 - 2 = 18 electrons."},{"skill":"ions","question":"What is an ion?","options":["A neutral atom","An atom or group of atoms with a net charge","A type of element","A particle in the nucleus"],"correct":1,"explanation":"An ion has a net electric charge. In this activity, ions are single atoms with unequal numbers of protons and electrons."},{"skill":"ions","question":"A positive ion is called a:","options":["Anion","Cation","Proton","Neutron"],"correct":1,"explanation":"A cation is a positive ion. A positive ion has fewer electrons than protons."},{"skill":"ions","question":"Metals typically form what type of ion?","options":["Negative ions (anions)","Positive ions (cations)","No ions","Neutral ions"],"correct":1,"explanation":"Metals LOSE electrons → become positive cations."},{"skill":"ions","question":"Chlorine (Group 17) gains 1 electron. What ion does it form?","options":["Cl¹⁺ (charge +1)","Cl¹⁻ (chloride, -1)","Cl²⁺ (charge +2)","Cl²⁻ (charge -2)"],"correct":1,"explanation":"Gaining 1 electron = -1 charge = Cl¹⁻ (chloride ion)."},{"skill":"ions","question":"Why does Sodium (Na) form a +1 ion instead of a -7 ion?","options":["Losing its one outer electron leaves the arrangement 2, 8","Sodium can't gain electrons","Sodium has no valence electrons","All metals must be +1"],"correct":0,"explanation":"Sodium commonly loses its one outer electron during reactions. Na¹⁺ has 11 protons and 10 electrons, arranged 2, 8. This gives sodium a full outer shell of 8 electrons."},{"skill":"ions","question":"An oxide ion (O²⁻) has 8 protons. How many electrons does it have?","options":["6","8","10","16"],"correct":2,"explanation":"O²⁻ means -2 charge. 8 protons + 2 extra electrons = 10 electrons."}];

function startQuiz(){const identity=readIdentity();if(!identity)return;const ids=[];Object.keys(SKILLS).forEach(skill=>{const pool=BANK.map((q,i)=>q.skill===skill?i:-1).filter(i=>i>=0);if(skill==='shells'){ids.push(shuffle(pool.filter(i=>BANK[i].target))[0],shuffle(pool.filter(i=>!BANK[i].target))[0]);}else ids.push(...shuffle(pool).slice(0,2));});state.quiz={ids:shuffle(ids),index:0,answers:[],selected:null,placement:[0,0,0],...identity,finishedAt:null,submission:null};render(true);}
function quizView(){const qz=state.quiz;if(!qz)return `<section class="card welcome"><span class="eyebrow">Put the pieces together</span><h2>How well can you explain an atom?</h2><p>Twelve questions across six skills, including a shell-building task. You’ll see an explanation after every answer and a skill summary at the end.</p><div class="formula">No timer. Each question counts once. Review and try a new set whenever you’re ready.</div>${identityFields()}<div class="actions"><button class="primary" data-action="start-quiz">Start knowledge check →</button><button data-mode="learn">Review lessons</button></div><p class="hint">Your name, email, class block, and completion results will be shared with your teacher through Google Forms. Your progress also saves on this device.</p></section>`;
if(qz.index>=qz.ids.length)return resultsView();const q=BANK[qz.ids[qz.index]],answer=qz.answers[qz.index],answered=!!answer;return `<div class="quizlayout"><section class="card"><div class="topline"><span class="eyebrow">Question ${qz.index+1} of ${qz.ids.length}</span><span class="tag">${SKILLS[q.skill]}</span></div><div class="progress"><span style="width:${100*qz.index/qz.ids.length}%"></span></div><h2 class="quiztitle">${q.question}</h2>${q.target?`<p class="muted">Click the model’s empty slots to place ${q.target.total} electrons. Click a filled slot to remove one.</p><div class="controls">${qz.placement.map((n,i)=>`<div class="counter"><label>Shell ${i+1}</label><button id="shell-${i}-minus" data-shell="${i}" data-delta="-1" aria-label="Remove electron from shell ${i+1}" ${answered||n===0?'disabled':''}>−</button><output aria-label="Electrons in shell ${i+1}">${n}</output><button id="shell-${i}-plus" data-shell="${i}" data-delta="1" aria-label="Add electron to shell ${i+1}" ${answered||n>=[2,8,8][i]?'disabled':''}>+</button></div>`).join('')}</div><p class="hint">Placed: ${qz.placement.reduce((s,n)=>s+n,0)} of ${q.target.total}</p>`:q.options.map((o,i)=>`<button class="choice ${answered&&i===q.correct?'correct':answered&&i===answer.selected?'wrong':''}" data-answer="${i}" aria-pressed="${qz.selected===i}" ${answered?'disabled':''}>${escapeHTML(o)}${answered&&i===q.correct?' ✓':''}</button>`).join('')}${answered?feedback((answer.correct?'Correct. ':'Not quite. ')+q.explanation,answer.correct):''}<div class="actions">${answered?`<button class="primary" data-action="next-question">${qz.index===11?'View results & submission':'Next question'} →</button>`:`<button class="primary" data-action="submit-question" ${q.target?qz.placement.reduce((s,n)=>s+n,0)!==q.target.total?'disabled':'':qz.selected===null?'disabled':''}>Check answer</button>`}</div></section><aside>${q.target?atomView({p:q.target.total,n:q.target.total,e:qz.placement.reduce((s,n)=>s+n,0)},qz.placement,{quiz:true}):'<section class="card"><span class="eyebrow">One question at a time</span><h3 style="margin-top:12px">Think it through.</h3><p class="muted" style="margin-top:12px">Read the particle counts carefully. Decide what changes and what stays the same.</p><p class="hint">You can switch tabs to review a lesson. Your place in this check is saved.</p></section>'}</aside></div>`;}
function summary(){const q=state.quiz;return Object.keys(SKILLS).map(skill=>{const answers=q.answers.filter((a,i)=>BANK[q.ids[i]].skill===skill);return {skill,total:answers.length,correct:answers.filter(a=>a.correct).length};});}
function resultsView(){const q=state.quiz,score=q.answers.filter(a=>a.correct).length;return `<div class="quizlayout"><section class="card"><span class="eyebrow">Knowledge check complete</span><h2>${score===12?'You connected all six skills.':'See what’s clicking. Choose what’s next.'}</h2><div class="resultscore">${score}<span style="font-size:30px;letter-spacing:-1px;color:var(--muted)"> / 12</span></div><p>${score===12?'Extend your thinking by building ions in Free explore.':'Use the skill summary to pick a lesson to revisit. A new check gives you another chance to practice.'}</p>${submissionPanel()}<div class="actions"><button data-action="download-report">Download a copy</button><button data-action="new-quiz">Try a new check</button></div><p class="hint">The record includes your lesson and building completion, quiz score, and skill summary.</p><details><summary>Review all answers</summary>${q.answers.map((a,i)=>{const item=BANK[q.ids[i]];return `<div style="padding:15px 0;border-bottom:1px solid var(--line)"><b>${i+1}. ${item.question}</b><p>${a.correct?'✓ Correct':'Review'} · Your response: ${escapeHTML(item.target?a.placement.join(', '):item.options[a.selected])}</p><p>${item.explanation}</p></div>`;}).join('')}</details></section><aside class="card"><span class="eyebrow">Your six skills</span>${summary().map(s=>`<div class="skillrow"><span>${SKILLS[s.skill]}<br><button class="chip quiet" data-review="${SKILL_LESSON[s.skill]}">Review lesson</button></span><b>${s.correct} / ${s.total}</b></div>`).join('')}</aside></div>`;}
function goStep(i){state.step=i;state.atom={...LESSONS[i].start};state.picked=null;state.groups=[];state.found=[];state.selectedGroup=1;state.recap=0;state.lessonFeedback='';state.lessonGood=false;state.mode='learn';render(true);}
function goMission(i){state.mission=i;state.labAtom={p:0,n:0,e:0};state.labFeedback='';state.labGood=false;render(true);}
function setParticle(scope,k,value){const a=scope==='lesson'?state.atom:state.labAtom;const parsed=Number(value);if(!Number.isFinite(parsed)){render();return;}a[k]=Math.max(0,Math.min(k==='n'?30:20,Math.trunc(parsed)));if(scope==='lesson')state.lessonFeedback='';else state.labFeedback='';render();announce(`${a.p} protons, ${a.n} neutrons, ${a.e} electrons. Net charge ${charge(a.p-a.e)}.`);}
function checkBuild(){const m=MISSIONS[state.mission],a=state.labAtom,errors=[];if(a.p!==m.p)errors.push(`Use atomic number ${m.p} for the proton count.`);if(a.n!==m.n)errors.push(`Neutrons = ${m.p+m.n} − ${m.p} = ${m.n}.`);if(a.e!==m.e)errors.push(`For charge ${charge(m.p-m.e)}, use ${m.e} electrons: ${m.p} − ${m.e} = ${charge(m.p-m.e)}.`);state.labGood=errors.length===0;state.labFeedback=errors.length?errors.join(' '):`Model complete. ${a.p} protons, ${a.n} neutrons, and ${a.e} electrons give mass number ${a.p+a.n} and charge ${charge(a.p-a.e)}.`;if(!errors.length&&!state.builds.includes(state.mission))state.builds.push(state.mission);render();}
function submitQuestion(){const qz=state.quiz,q=BANK[qz.ids[qz.index]];if(qz.answers[qz.index])return;if(q.target&&qz.placement.reduce((s,n)=>s+n,0)!==q.target.total||!q.target&&qz.selected===null)return;const correct=q.target?qz.placement.every((n,i)=>n===q.target['shell'+(i+1)]):qz.selected===q.correct;qz.answers.push({correct,selected:qz.selected,placement:[...qz.placement]});if(qz.answers.length===12)qz.finishedAt=new Date().toISOString();render();queueCompletion();}
function downloadReport(){const q=state.quiz;const lines=['ATOMIC STUDIO · PRACTICE RECORD',`Name: ${q.name||'Not provided'}`,`Email: ${q.email||'Not provided'}`,`Class block: ${q.block||'Not provided'}`,`Completed: ${q.finishedAt}`,`Score: ${q.answers.filter(a=>a.correct).length} / 12`,'','Browser-generated practice record. Google submission status: '+(q.submission?.status||'not submitted'),'',...summary().map(s=>`${SKILLS[s.skill]}: ${s.correct}/${s.total}`),'',...q.answers.flatMap((a,i)=>{const item=BANK[q.ids[i]];return [`${i+1}. ${item.question}`,`Response: ${item.target?a.placement.join(', '):item.options[a.selected]}`,`${a.correct?'Correct':'Incorrect'}. ${item.explanation}`,''];})];const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='atomic-studio-results.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-model]')){e.preventDefault();useModel(e.target.dataset);}});
document.addEventListener('change',e=>{if(e.target.dataset.input)setParticle(e.target.dataset.scope,e.target.dataset.input,e.target.value);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-model],button');if(!b||b.disabled)return;const d=b.dataset;if(d.model){useModel(d);return;}if(d.tool){state.tool=d.tool;state.labFeedback='';render();return;}if(d.operation){state.operation=d.operation;render();return;}if(d.group){state.selectedGroup=+d.group;state.lessonFeedback='';render();return;}if(d.groupAnswer){const expected=state.selectedGroup<3?state.selectedGroup:state.selectedGroup-10;if(+d.groupAnswer!==expected){modelMessage(`Group ${state.selectedGroup} has ${expected} valence electrons${state.selectedGroup===18?', except helium, which has 2':''}. Use that number for your guide.`);return;}if(!state.groups.includes(state.selectedGroup))state.groups.push(state.selectedGroup);state.lessonFeedback=`Group ${state.selectedGroup}: ${expected} valence electrons. Select another group to continue.`;state.lessonGood=true;completeLesson();render();return;}if(d.discover){const z=+d.discover;if(state.step===3){state.selectedGroup=ELEMENTS[z-1][3];render();return;}const target=state.step===5?METALS:NONMETALS;if(!target.includes(z)){modelMessage(z===1?'Hydrogen is a nonmetal, even though it is on the left.':ELEMENTS[z-1][3]===18?'This is a noble gas. It is a nonmetal, but leave group 18 out of this selection.':`${ELEMENTS[z-1][1]} is a ${ELEMENTS[z-1][4]}. Find ${state.step===5?'a metal':'a nonmetal outside group 18'}.`);return;}if(!state.found.includes(z))state.found.push(z);state.lessonFeedback=`${ELEMENTS[z-1][1]} found. ${state.found.length} of ${target.length} selected.`;state.lessonGood=true;completeLesson();render();return;}if(d.mode){if(d.mode!=='learn'&&state.done.length<LESSONS.length||d.mode==='quiz'&&state.builds.length<MISSIONS.length)return;state.mode=d.mode;render(true);return;}if(d.step!==undefined){goStep(+d.step);return;}if(d.review!==undefined){goStep(+d.review);return;}if(d.mission!==undefined){goMission(+d.mission);return;}if(d.counter){const a=d.scope==='lesson'?state.atom:state.labAtom;setParticle(d.scope,d.counter,a[d.counter]+Number(d.delta));return;}if(d.element){const z=+d.element;const a={p:z,n:ELEMENTS[z-1][2]-z,e:z};if(state.mode==='learn'){state.atom=a;state.lessonFeedback='';}else{state.labAtom=a;state.labFeedback='';}render();announce(`${ELEMENTS[z-1][1]} selected. ${z} protons and ${z} electrons.`);return;}if(d.answer!==undefined){if(!state.quiz.answers[state.quiz.index])state.quiz.selected=+d.answer;render();return;}if(d.shell!==undefined){if(!state.quiz.answers[state.quiz.index]){const i=+d.shell;state.quiz.placement[i]=Math.max(0,Math.min([2,8,8][i],state.quiz.placement[i]+Number(d.delta)));}render();return;}
switch(d.action){case'replay-lesson':goStep(state.step);break;case'recap-chlorine':state.atom={p:17,n:18,e:17};state.lessonFeedback='Now do the opposite: add one electron to chlorine’s outer shell.';state.lessonGood=false;render();break;case'hint-lesson':state.lessonFeedback=LESSONS[state.step].hint;state.lessonGood=false;render();break;case'prev-lesson':if(state.step>0)goStep(state.step-1);break;case'next-lesson':if(!state.done.includes(state.step))break;if(state.step<LESSONS.length-1)goStep(state.step+1);else{state.mode='lab';render(true);}break;case'check-build':checkBuild();break;case'hint-build':state.labFeedback='Start with protons = atomic number. Then subtract protons from mass number to find neutrons. A positive ion has fewer electrons; a negative ion has extra electrons.';state.labGood=false;render();break;case'clear-build':state.labAtom={p:0,n:0,e:0};state.labFeedback='';render();break;case'neutral':state.labAtom.e=state.labAtom.p;render();break;case'prev-build':if(state.mission>0)goMission(state.mission-1);break;case'next-build':if(!state.builds.includes(state.mission))break;if(state.mission<4)goMission(state.mission+1);else{state.mode='quiz';render(true);}break;case'explore-mode':state.explore=true;state.labFeedback='';render();break;case'challenge-mode':state.explore=false;state.labFeedback='';render();break;case'save-identity':saveIdentity();break;case'retry-submission':retrySubmission();break;case'start-quiz':startQuiz();break;case'new-quiz':if(['pending','offline','sending','uncertain','attempted','error'].includes(state.quiz?.submission?.status)){announce('Resend or submit your saved completion record before starting a new check.');return;}state.quiz=null;render(true);break;case'submit-question':submitQuestion();break;case'next-question':if(!state.quiz.answers[state.quiz.index])break;state.quiz.index++;state.quiz.selected=null;state.quiz.placement=[0,0,0];if(state.quiz.index===12&&!state.quiz.finishedAt)state.quiz.finishedAt=new Date().toISOString();render(true);queueCompletion();break;case'download-report':downloadReport();break;}
});
$('reset-progress').onclick=()=>$('reset-dialog').showModal();$('cancel-reset').onclick=()=>$('reset-dialog').close();$('confirm-reset').onclick=()=>{state=initial();$('reset-dialog').close();render(true);};document.addEventListener('submit',e=>{if(e.target.id==='student-details'){e.preventDefault();if(state.quiz?.index===12)saveIdentity();else startQuiz();}});render();queueCompletion();
</script>
