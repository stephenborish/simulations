{title:'Build the center of an atom.',short:'Nucleus',body:'The <b>nucleus</b> holds <b>protons</b> (+) and <b>neutrons</b> (0). The number of protons tells you the element.',formula:'Atomic number = protons<br>Mass number = protons + neutrons',stats:['p','n','mass'],start:{p:0,n:0,e:0},success:'Lithium nucleus complete: 3 protons make it lithium, and 3 + 4 neutrons give mass number 7.',hint:'Click the glowing nucleus three times for protons, then four more times for neutrons.'},

const BANK=[{"skill":"protons","question":"What particle determines what element an atom is?","options":["Electrons","Protons","Neutrons","Photons"],"correct":1,"explanation":"Protons define the element. The number of protons = the atomic number."},{"skill":"protons","question":"An atom has 1 proton. What element is it?","options":["Helium","Lithium","Hydrogen","Carbon"],"correct":2,"explanation":"1 proton = Hydrogen. It's the simplest element!"},{"skill":"protons","question":"An atom has 6 protons. What element is it?","options":["Oxygen","Carbon","Nitrogen","Helium"],"correct":1,"explanation":"6 protons = Carbon (atomic number 6)."},{"skill":"protons","question":"If you change the number of protons in an atom, what happens?","options":["The charge changes","It becomes a different element","Nothing changes","It becomes an ion"],"correct":1,"explanation":"Changing protons changes the element entirely!"},{"skill":"protons","question":"An atom has 17 protons, 18 neutrons, and 18 electrons. What element is it?","options":["Argon","Chlorine","Sulfur","Potassium"],"correct":1,"explanation":"17 protons = Chlorine. Neutrons and electrons don't change the element!"},{"skill":"neutrons","question":"What is the charge of a neutron?","options":["+1","-1","0 (neutral)","+2"],"correct":2,"explanation":"Neutrons have NO charge - they're neutral!"},{"skill":"neutrons","question":"Where are neutrons located in an atom?","options":["In the shells","In the nucleus","Outside the atom","Floating freely"],"correct":1,"explanation":"Neutrons are in the nucleus along with protons."},{"skill":"neutrons","question":"Carbon has atomic number 6 and mass number 12. How many neutrons does it have?","options":["6","12","18","0"],"correct":0,"explanation":"Neutrons = Mass Number - Atomic Number = 12 - 6 = 6 neutrons."},{"skill":"neutrons","question":"Sodium has 11 protons and mass number 23. How many neutrons?","options":["11","12","23","34"],"correct":1,"explanation":"Neutrons = 23 - 11 = 12 neutrons."},{"skill":"neutrons","question":"Two atoms both have 6 protons, but one has 6 neutrons and one has 7. What are these called?","options":["Ions","Isotopes","Isomers","Different elements"],"correct":1,"explanation":"Same protons, different neutrons = Isotopes (like Carbon-12 and Carbon-13)."},{"skill":"valence","question":"What are valence electrons?","options":["All electrons in an atom","Electrons in the innermost shell","Electrons in the outermost shell","Electrons in the nucleus"],"correct":2,"explanation":"Valence electrons are in the outermost shell - they're the ones that bond!"},{"skill":"valence","question":"Elements in Group 1 have how many valence electrons?","options":["1","2","7","8"],"correct":0,"explanation":"Neutral group 1 atoms have 1 valence electron. For groups 1 and 2, use the group number."},{"skill":"valence","question":"Chlorine is in Group 17. How many valence electrons does it have?","options":["1","7","8","17"],"correct":1,"explanation":"Group 17 = 7 valence electrons. (For groups 13-18, subtract 10.)"},{"skill":"valence","question":"Silicon is in Group 14. How many valence electrons does it have?","options":["2","4","10","14"],"correct":1,"explanation":"Group 14 - 10 = 4 valence electrons."},{"skill":"valence","question":"An element has 2 electrons in shell 1 and 5 electrons in shell 2. What group is it in?","options":["Group 2","Group 5","Group 7","Group 15"],"correct":3,"explanation":"5 valence electrons correspond to group 15. Use the last digit of 15."},{"skill":"shells","question":"What is the maximum number of electrons Shell 1 can hold?","options":["1","2","8","18"],"correct":1,"explanation":"Shell 1 can hold a maximum of 2 electrons."},{"skill":"shells","question":"Which shell fills with electrons first?","options":["The outermost shell","Shell 1 (innermost)","Shell 2","Any shell randomly"],"correct":1,"explanation":"Electrons fill from the inside out - Shell 1 first!"},{"skill":"shells","question":"Oxygen has 8 electrons. How are they arranged in shells?","options":["8 in Shell 1","2 in Shell 1, 6 in Shell 2","4 in Shell 1, 4 in Shell 2","6 in Shell 1, 2 in Shell 2"],"correct":1,"explanation":"Shell 1 fills first (max 2), then remaining 6 go to Shell 2."},{"skill":"shells","question":"Sodium has 11 electrons. What's the arrangement?","options":["2, 8, 1","2, 9, 0","11, 0, 0","2, 2, 7"],"correct":0,"explanation":"Shell 1: 2, Shell 2: 8 (full), Shell 3: 1 remaining = 2, 8, 1"},{"skill":"shells","subtype":"electron-placement","question":"Place the electrons correctly for CARBON (6 electrons).","target":{"shell1":2,"shell2":4,"shell3":0,"total":6},"explanation":"Carbon: 2 electrons in Shell 1, 4 electrons in Shell 2."},{"skill":"shells","subtype":"electron-placement","question":"Place the electrons correctly for NEON (10 electrons).","target":{"shell1":2,"shell2":8,"shell3":0,"total":10},"explanation":"Neon has 2 electrons in shell 1 and 8 in shell 2. This arrangement is associated with its low chemical reactivity."},{"skill":"charge","question":"A neutral atom has equal numbers of which particles?","options":["Protons and neutrons","Protons and electrons","Neutrons and electrons","All three are equal"],"correct":1,"explanation":"Neutral = protons (+) equal electrons (-). Charges cancel out!"},{"skill":"charge","question":"What is the charge of a proton?","options":["-1","0","+1","+2"],"correct":2,"explanation":"Protons have a +1 positive charge."},{"skill":"charge","question":"An atom has 11 protons and 10 electrons. What is its charge?","options":["-1","0","+1","+11"],"correct":2,"explanation":"Net charge = number of protons − number of electrons. 11 − 10 = +1."},{"skill":"charge","question":"An atom has 9 protons and 10 electrons. What is its charge?","options":["-1","0","+1","-10"],"correct":0,"explanation":"9 protons - 10 electrons = -1 charge."},{"skill":"charge","question":"Calcium (20 protons) forms a +2 ion. How many electrons does it have?","options":["18","20","22","2"],"correct":0,"explanation":"+2 charge means it lost 2 electrons: 20 - 2 = 18 electrons."},{"skill":"ions","question":"What is an ion?","options":["A neutral atom","An atom or group of atoms with a net charge","A type of element","A particle in the nucleus"],"correct":1,"explanation":"An ion has a net electric charge. In this activity, ions are single atoms with unequal numbers of protons and electrons."},{"skill":"ions","question":"A positive ion is called a:","options":["Anion","Cation","Proton","Neutron"],"correct":1,"explanation":"A cation is a positive ion. A positive ion has fewer electrons than protons."},{"skill":"ions","question":"Metals typically form what type of ion?","options":["Negative ions (anions)","Positive ions (cations)","No ions","Neutral ions"],"correct":1,"explanation":"Metals LOSE electrons → become positive cations."},{"skill":"ions","question":"Chlorine (Group 17) gains 1 electron. What ion does it form?","options":["Cl¹⁺ (charge +1)","Cl¹⁻ (chloride, -1)","Cl²⁺ (charge +2)","Cl²⁻ (charge -2)"],"correct":1,"explanation":"Gaining 1 electron = -1 charge = Cl¹⁻ (chloride ion)."},{"skill":"ions","question":"Why does Sodium (Na) form a +1 ion instead of a -7 ion?","options":["Losing its one outer electron leaves the arrangement 2, 8","Sodium can't gain electrons","Sodium has no valence electrons","All metals must be +1"],"correct":0,"explanation":"Sodium commonly loses its one outer electron during reactions. Na¹⁺ has 11 protons and 10 electrons, arranged 2, 8. This gives sodium a full outer shell of 8 electrons."},{"skill":"ions","question":"An oxide ion (O²⁻) has 8 protons. How many electrons does it have?","options":["6","8","10","16"],"correct":2,"explanation":"O²⁻ means -2 charge. 8 protons + 2 extra electrons = 10 electrons."}];

const QUIZ_LENGTH=12,PASS_PERCENT=70,PASS_SCORE=Math.ceil(QUIZ_LENGTH*PASS_PERCENT/100);
const rz=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));const pick=a=>a[Math.floor(Math.random()*a.length)];

const valence=z=>shells(z).filter(Boolean).pop();const arrangement=e=>shells(e).filter(Boolean).join(', ');

function ionSymbol(sym,q){return sym+String(Math.abs(q)).replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d])+(q>0?'⁺':'⁻');}
function commonIon(z){const g=el(z).group;return z===1?null:{1:1,2:2,13:z===13?3:null,15:-3,16:-2,17:-1}[g]??null;}

// Distractors are listed in priority order; the first three distinct wrong answers are used.
function mc(skill,key,question,correct,distractors,explanation){correct=String(correct);const wrong=[...new Set(distractors.map(String))].filter(o=>o!==correct).slice(0,3);if(wrong.length<3)return null;const options=shuffle([correct,...wrong]);return {key,skill,question,options,correct:options.indexOf(correct),explanation};}
function conceptItem(skill,used){const pool=BANK.map((q,i)=>i).filter(i=>BANK[i].skill===skill&&!BANK[i].target&&!/\d/.test(BANK[i].question)&&!used.has('concept:'+i));if(!pool.length)return null;const i=pick(pool),q=BANK[i],options=shuffle([...q.options]);return {key:'concept:'+i,skill,question:q.question,options,correct:options.indexOf(q.options[q.correct]),explanation:q.explanation};}

function goMission(i){state.mission=i;state.labAtom={p:0,n:0,e:0};state.labFeedback='';state.labGood=false;render(true);}
function setParticle(scope,k,value){const a=scope==='lesson'?state.atom:state.labAtom;const parsed=Number(value);if(!Number.isFinite(parsed)){render();return;}a[k]=Math.max(0,Math.min(k==='n'?30:20,Math.trunc(parsed)));if(scope==='lesson')state.lessonFeedback='';else state.labFeedback='';render();announce(`${a.p} protons, ${a.n} neutrons, ${a.e} electrons. Net charge ${charge(a.p-a.e)}.`);}
function checkBuild(){const m=MISSIONS[state.mission],a=state.labAtom,errors=[];if(a.p!==m.p)errors.push(`Use atomic number ${m.p} for the proton count.`);if(a.n!==m.n)errors.push(`Neutrons = ${m.p+m.n} − ${m.p} = ${m.n}.`);if(a.e!==m.e)errors.push(`For charge ${charge(m.p-m.e)}, use ${m.e} electrons: ${m.p} − ${m.e} = ${charge(m.p-m.e)}.`);state.labGood=errors.length===0;state.labFeedback=errors.length?errors.join(' '):`Model complete. ${a.p} protons, ${a.n} neutrons, and ${a.e} electrons give mass number ${a.p+a.n} and charge ${charge(a.p-a.e)}.`;if(!errors.length&&!state.builds.includes(state.mission))state.builds.push(state.mission);render();}
function submitQuestion(){const qz=state.quiz,q=qz.items[qz.index];if(qz.answers[qz.index])return;if(q.target&&qz.placement.reduce((s,n)=>s+n,0)!==q.target.total||!q.target&&qz.selected===null)return;const correct=q.target?qz.placement.every((n,i)=>n===q.target['shell'+(i+1)]):qz.selected===q.correct;qz.answers.push({correct,selected:qz.selected,placement:[...qz.placement]});if(qz.answers.length===QUIZ_LENGTH)qz.finishedAt=new Date().toISOString();render();queueCompletion();}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-model]')){e.preventDefault();useModel(e.target.dataset);}});
document.addEventListener('change',e=>{if(e.target.dataset.input)setParticle(e.target.dataset.scope,e.target.dataset.input,e.target.value);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-model],button');if(!b||b.disabled)return;const d=b.dataset;if(d.model){useModel(d);return;}if(d.tool){state.tool=d.tool;state.labFeedback='';render();return;}if(d.operation){state.operation=d.operation;render();return;}if(d.group){state.selectedGroup=+d.group;state.lessonFeedback='';render();return;}if(d.groupAnswer){const expected=groupValence(state.selectedGroup);if(+d.groupAnswer!==expected){modelMessage(state.selectedGroup<3?`Not quite. For groups 1–2, use the group number.`:`Not quite. For group ${state.selectedGroup}, use the last digit of the group number.`);return;}const doneGroup=state.selectedGroup;if(!state.groups.includes(doneGroup))state.groups.push(doneGroup);const next=GROUPS.find(g=>!state.groups.includes(g));if(next)state.selectedGroup=next;state.lessonFeedback=`✓ Group ${doneGroup}: ${expected} valence electrons.`;state.lessonGood=true;completeLesson();render();announce(state.lessonFeedback+(next?` Next: group ${next}.`:''));return;}if(d.discover){const z=+d.discover;if(state.step===3){state.selectedGroup=ELEMENTS[z-1][3];render();return;}const target=state.step===5?METALS:NONMETALS;if(!target.includes(z)){modelMessage(z===1?'Hydrogen is a nonmetal, even though it is on the left.':ELEMENTS[z-1][3]===18?'This is a noble gas. It is a nonmetal, but leave group 18 out of this selection.':`${ELEMENTS[z-1][1]} is a ${ELEMENTS[z-1][4]}. Find ${state.step===5?'a metal':'a nonmetal outside group 18'}.`);return;}if(!state.found.includes(z))state.found.push(z);state.lessonFeedback=`${ELEMENTS[z-1][1]} found. ${state.found.length} of ${target.length} selected.`;state.lessonGood=true;completeLesson();render();return;}if(d.mode){if(d.mode!=='learn'&&state.done.length<LESSONS.length||d.mode==='quiz'&&state.builds.length<MISSIONS.length)return;state.mode=d.mode;render(true);return;}if(d.step!==undefined){goStep(+d.step);return;}if(d.review!==undefined){goStep(+d.review);return;}if(d.mission!==undefined){goMission(+d.mission);return;}if(d.counter){const a=d.scope==='lesson'?state.atom:state.labAtom;setParticle(d.scope,d.counter,a[d.counter]+Number(d.delta));return;}if(d.element){if($('table-dialog').open)$('table-dialog').close();const z=+d.element;const a={p:z,n:ELEMENTS[z-1][2]-z,e:z};if(state.mode==='learn'){state.atom=a;state.lessonFeedback='';}else{state.labAtom=a;state.labFeedback='';}render();announce(`${ELEMENTS[z-1][1]} selected. ${z} protons and ${z} electrons.`);return;}if(d.answer!==undefined){if(!state.quiz.answers[state.quiz.index])state.quiz.selected=+d.answer;render();return;}if(d.shell!==undefined){if(!state.quiz.answers[state.quiz.index]){const i=+d.shell;state.quiz.placement[i]=Math.max(0,Math.min([2,8,8][i],state.quiz.placement[i]+Number(d.delta)));}render();return;}
switch(d.action){case'replay-lesson':goStep(state.step);break;case'recap-chlorine':state.atom={p:17,n:18,e:17};state.lessonFeedback='Now do the opposite: add one electron to chlorine’s outer shell.';state.lessonGood=false;render();break;case'hint-lesson':state.lessonFeedback=LESSONS[state.step].hint;state.lessonGood=false;render();break;case'prev-lesson':if(state.step>0)goStep(state.step-1);break;case'next-lesson':if(!state.done.includes(state.step))break;if(state.step<LESSONS.length-1)goStep(state.step+1);else{state.mode='lab';render(true);}break;case'check-build':checkBuild();break;case'hint-build':state.labFeedback='1. Protons = atomic number. 2. Neutrons = mass number − protons. 3. Electrons: a positive ion has fewer than the protons; a negative ion has more.';state.labGood=false;render();break;case'clear-build':state.labAtom={p:0,n:0,e:0};state.labFeedback='';render();break;case'open-table':$('table-dialog-body').innerHTML=table(state.labAtom);$('table-dialog').showModal();break;case'neutral':state.labAtom.e=state.labAtom.p;render();break;case'prev-build':if(state.mission>0)goMission(state.mission-1);break;case'next-build':if(!state.builds.includes(state.mission))break;if(state.mission<4)goMission(state.mission+1);else{state.mode='quiz';render(true);}break;case'explore-mode':state.explore=true;state.labFeedback='';render();break;case'challenge-mode':state.explore=false;state.labFeedback='';render();break;case'save-identity':saveIdentity();break;case'retry-submission':retrySubmission();break;case'start-quiz':startQuiz();break;case'retake-quiz':retakeQuiz();break;case'submit-question':submitQuestion();break;case'next-question':if(!state.quiz.answers[state.quiz.index])break;state.quiz.index++;state.quiz.selected=null;state.quiz.placement=[0,0,0];if(state.quiz.index===QUIZ_LENGTH&&!state.quiz.finishedAt)state.quiz.finishedAt=new Date().toISOString();render(true);queueCompletion();break;}
});
$('close-table').onclick=()=>$('table-dialog').close();document.addEventListener('submit',e=>{if(e.target.id==='student-details'){e.preventDefault();if(state.quiz?.index===QUIZ_LENGTH)saveIdentity();else startQuiz();}});render();queueCompletion();
</script>
</body>
