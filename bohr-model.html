// Standalone, dependency-free activity. Scope: first 20 elements and their common ions.
const ELEMENTS=[['H','Hydrogen',1,1,'nonmetal'],['He','Helium',4,18,'nonmetal'],['Li','Lithium',7,1,'metal'],['Be','Beryllium',9,2,'metal'],['B','Boron',11,13,'metalloid'],['C','Carbon',12,14,'nonmetal'],['N','Nitrogen',14,15,'nonmetal'],['O','Oxygen',16,16,'nonmetal'],['F','Fluorine',19,17,'nonmetal'],['Ne','Neon',20,18,'nonmetal'],['Na','Sodium',23,1,'metal'],['Mg','Magnesium',24,2,'metal'],['Al','Aluminum',27,13,'metal'],['Si','Silicon',28,14,'metalloid'],['P','Phosphorus',31,15,'nonmetal'],['S','Sulfur',32,16,'nonmetal'],['Cl','Chlorine',35,17,'nonmetal'],['Ar','Argon',40,18,'nonmetal'],['K','Potassium',39,1,'metal'],['Ca','Calcium',40,2,'metal']];
const GROUPS=[1,2,13,14,15,16,17,18];
const SKILLS={protons:'Element identity',neutrons:'Neutrons & isotopes',valence:'Valence electrons',shells:'Electron shells',charge:'Net charge',ions:'Ions'};
const SKILL_LESSON={protons:0,neutrons:1,valence:3,shells:2,charge:4,ions:5};
const MISSIONS=[{name:'Carbon-12',p:6,n:6,e:6,text:'Build a neutral carbon atom. Its atomic number is 6 and its mass number is 12.'},{name:'Neon-20',p:10,n:10,e:10,text:'Build a neutral neon atom. Its atomic number is 10 and its mass number is 20.'},{name:'Sodium ion',p:11,n:12,e:10,text:'Start with sodium-23 (atomic number 11). It has lost one electron. Build the resulting ion.'},{name:'Chloride ion',p:17,n:18,e:18,text:'Start with chlorine-35 (atomic number 17). It has gained one electron. Build the resulting ion.'},{name:'Hydrogen-1',p:1,n:0,e:1,text:'Build neutral hydrogen with atomic number 1 and mass number 1. Does every atom need a neutron?'}];
const LESSONS=[
{title:'Protons set the identity.',body:'An atom’s center is its <b>nucleus</b>. It contains positively charged <b>protons</b> and uncharged <b>neutrons</b>. The number of protons is the <b>atomic number</b>.',formula:'Atomic number = number of protons',task:'Build a carbon nucleus with 6 protons. Watch the element change as you add them.',start:{p:3,n:6,e:0},controls:['p'],check:a=>a.p===6,success:'Six protons identify carbon. Changing the number of protons changes the element.',hint:'Find carbon’s atomic number: 6. Set the proton count to 6.'},
{title:'Same element. Different isotope.',body:'<b>Mass number</b> counts protons and neutrons. <b>Isotopes</b> are atoms of the same element with different numbers of neutrons. Mass number is a whole number for a specific isotope; it is not the average atomic mass on a periodic table.',formula:'Neutrons = mass number − atomic number',task:'Change carbon-12 to carbon-14. Keep 6 protons and change only the neutrons.',start:{p:6,n:6,e:6},controls:['n'],check:a=>a.n===8,success:'6 protons + 8 neutrons = mass number 14. It is still carbon because it still has 6 protons.',hint:'14 − 6 = 8 neutrons.'},
{title:'Arrange the electrons.',body:'<b>Electrons</b> have a negative charge. Bohr diagrams group electrons into <b>shells</b>. Shell 1 holds up to 2 electrons; shell 2 holds up to 8. The outermost occupied shell contains the <b>valence electrons</b>.',formula:'Neutral oxygen: 8 protons = 8 electrons',task:'Add electrons to make oxygen neutral. Notice how they fill the shells.',start:{p:8,n:8,e:0},controls:['e'],check:a=>a.e===8,success:'Oxygen’s 8 electrons are arranged 2, 6. Its 6 outer-shell electrons are its valence electrons.',hint:'A neutral atom has equal numbers of protons and electrons. Add 8 electrons.'},
{title:'Find the pattern in a group.',body:'In the part of the table shown here, neutral atoms in groups 1 and 2 have 1 and 2 valence electrons. Groups 13–18 have 3–8. <b>Helium is the exception:</b> its first shell is full with 2 electrons.',formula:'Group 17 → 7 valence electrons',task:'Select chlorine (Cl) in the table. Then choose its number of valence electrons.',start:{p:11,n:12,e:11},controls:[],check:a=>a.p===17,success:'Chlorine is in group 17. Its neutral arrangement is 2, 8, 7, so it has 7 valence electrons.',hint:'Find Cl under group 17. The last digit gives 7 valence electrons.'},
{title:'Lose an electron. Gain a charge.',body:'An <b>ion</b> has a net electric charge. Metals commonly lose electrons when forming ions. A <b>cation</b> is a positive ion: it has more protons than electrons.',formula:'Net charge = protons − electrons',task:'Remove one electron from neutral sodium to make Na⁺. Keep the nucleus unchanged.',start:{p:11,n:12,e:11},controls:['e'],check:a=>a.e===10,success:'11 protons − 10 electrons = +1. Na⁺ has the electron arrangement 2, 8. Its identity stays sodium.',hint:'Remove one of the 11 electrons. You should have 10 left.'},
{title:'Gain an electron. Become negative.',body:'Nonmetals such as chlorine can gain electrons when forming ions. An <b>anion</b> is a negative ion: it has more electrons than protons. Nonmetals can also share electrons in bonds.',formula:'17 protons − 18 electrons = −1',task:'Add one electron to neutral chlorine to build a chloride ion, Cl⁻.',start:{p:17,n:18,e:17},controls:['e'],check:a=>a.e===18,success:'Cl⁻ has 18 electrons arranged 2, 8, 8. Gaining a negative electron makes the net charge −1.',hint:'Start with 17 electrons and add one: 18 electrons.'},
{title:'A full outer shell.',body:'Atoms often gain, lose, or share electrons to have <b>8 electrons in their outer shell</b>. This is the <b>octet rule</b>. A full outer shell is a stable electron arrangement. <b>Helium is the exception:</b> its first shell is full with just 2 electrons.',formula:'An octet = 8 outer-shell electrons',task:'Which statement correctly describes the octet rule?',start:{p:10,n:10,e:10},controls:[],success:'The octet rule describes a stable arrangement of 8 outer-shell electrons. Helium’s outer shell is full with 2. You’re ready to build atoms and ions.',hint:'Focus on the electrons in the outer shell. Atoms can gain, lose, or share electrons.'}
];
const BANK=[{"skill":"protons","question":"What particle determines what element an atom is?","options":["Electrons","Protons","Neutrons","Photons"],"correct":1,"explanation":"Protons define the element. The number of protons = the atomic number."},{"skill":"protons","question":"An atom has 1 proton. What element is it?","options":["Helium","Lithium","Hydrogen","Carbon"],"correct":2,"explanation":"1 proton = Hydrogen. It's the simplest element!"},{"skill":"protons","question":"An atom has 6 protons. What element is it?","options":["Oxygen","Carbon","Nitrogen","Helium"],"correct":1,"explanation":"6 protons = Carbon (atomic number 6)."},{"skill":"protons","question":"If you change the number of protons in an atom, what happens?","options":["The charge changes","It becomes a different element","Nothing changes","It becomes an ion"],"correct":1,"explanation":"Changing protons changes the element entirely!"},{"skill":"protons","question":"An atom has 17 protons, 18 neutrons, and 18 electrons. What element is it?","options":["Argon","Chlorine","Sulfur","Potassium"],"correct":1,"explanation":"17 protons = Chlorine. Neutrons and electrons don't change the element!"},{"skill":"neutrons","question":"What is the charge of a neutron?","options":["+1","-1","0 (neutral)","+2"],"correct":2,"explanation":"Neutrons have NO charge - they're neutral!"},{"skill":"neutrons","question":"Where are neutrons located in an atom?","options":["In the shells","In the nucleus","Outside the atom","Floating freely"],"correct":1,"explanation":"Neutrons are in the nucleus along with protons."},{"skill":"neutrons","question":"Carbon has atomic number 6 and mass number 12. How many neutrons does it have?","options":["6","12","18","0"],"correct":0,"explanation":"Neutrons = Mass Number - Atomic Number = 12 - 6 = 6 neutrons."},{"skill":"neutrons","question":"Sodium has 11 protons and mass number 23. How many neutrons?","options":["11","12","23","34"],"correct":1,"explanation":"Neutrons = 23 - 11 = 12 neutrons."},{"skill":"neutrons","question":"Two atoms both have 6 protons, but one has 6 neutrons and one has 7. What are these called?","options":["Ions","Isotopes","Isomers","Different elements"],"correct":1,"explanation":"Same protons, different neutrons = Isotopes (like Carbon-12 and Carbon-13)."},{"skill":"valence","question":"What are valence electrons?","options":["All electrons in an atom","Electrons in the innermost shell","Electrons in the outermost shell","Electrons in the nucleus"],"correct":2,"explanation":"Valence electrons are in the outermost shell - they're the ones that bond!"},{"skill":"valence","question":"Elements in Group 1 have how many valence electrons?","options":["1","2","7","8"],"correct":0,"explanation":"Group 1 = 1 valence electron. Group number = valence electrons (for main groups)!"},{"skill":"valence","question":"Chlorine is in Group 17. How many valence electrons does it have?","options":["1","7","8","17"],"correct":1,"explanation":"Group 17 = 7 valence electrons. (For groups 13-18, subtract 10.)"},{"skill":"valence","question":"Silicon is in Group 14. How many valence electrons does it have?","options":["2","4","10","14"],"correct":1,"explanation":"Group 14 - 10 = 4 valence electrons."},{"skill":"valence","question":"An element has 2 electrons in shell 1 and 5 electrons in shell 2. What group is it in?","options":["Group 2","Group 5","Group 7","Group 15"],"correct":3,"explanation":"5 valence electrons = Group 15 (5 + 10 = 15 for the third row)."},{"skill":"shells","question":"What is the maximum number of electrons Shell 1 can hold?","options":["1","2","8","18"],"correct":1,"explanation":"Shell 1 can hold a maximum of 2 electrons."},{"skill":"shells","question":"Which shell fills with electrons first?","options":["The outermost shell","Shell 1 (innermost)","Shell 2","Any shell randomly"],"correct":1,"explanation":"Electrons fill from the inside out - Shell 1 first!"},{"skill":"shells","question":"Oxygen has 8 electrons. How are they arranged in shells?","options":["8 in Shell 1","2 in Shell 1, 6 in Shell 2","4 in Shell 1, 4 in Shell 2","6 in Shell 1, 2 in Shell 2"],"correct":1,"explanation":"Shell 1 fills first (max 2), then remaining 6 go to Shell 2."},{"skill":"shells","question":"Sodium has 11 electrons. What's the arrangement?","options":["2, 8, 1","2, 9, 0","11, 0, 0","2, 2, 7"],"correct":0,"explanation":"Shell 1: 2, Shell 2: 8 (full), Shell 3: 1 remaining = 2, 8, 1"},{"skill":"shells","subtype":"electron-placement","question":"Place the electrons correctly for CARBON (6 electrons).","target":{"shell1":2,"shell2":4,"shell3":0,"total":6},"explanation":"Carbon: 2 electrons in Shell 1, 4 electrons in Shell 2."},{"skill":"shells","subtype":"electron-placement","question":"Place the electrons correctly for NEON (10 electrons).","target":{"shell1":2,"shell2":8,"shell3":0,"total":10},"explanation":"Neon has 2 electrons in shell 1 and 8 in shell 2. This arrangement is associated with its low chemical reactivity."},{"skill":"charge","question":"A neutral atom has equal numbers of which particles?","options":["Protons and neutrons","Protons and electrons","Neutrons and electrons","All three are equal"],"correct":1,"explanation":"Neutral = protons (+) equal electrons (-). Charges cancel out!"},{"skill":"charge","question":"What is the charge of a proton?","options":["-1","0","+1","+2"],"correct":2,"explanation":"Protons have a +1 positive charge."},{"skill":"charge","question":"An atom has 11 protons and 10 electrons. What is its charge?","options":["-1","0","+1","+11"],"correct":2,"explanation":"Net charge = number of protons − number of electrons. 11 − 10 = +1."},{"skill":"charge","question":"An atom has 9 protons and 10 electrons. What is its charge?","options":["-1","0","+1","-10"],"correct":0,"explanation":"9 protons - 10 electrons = -1 charge."},{"skill":"charge","question":"Calcium (20 protons) forms a +2 ion. How many electrons does it have?","options":["18","20","22","2"],"correct":0,"explanation":"+2 charge means it lost 2 electrons: 20 - 2 = 18 electrons."},{"skill":"ions","question":"What is an ion?","options":["A neutral atom","An atom or group of atoms with a net charge","A type of element","A particle in the nucleus"],"correct":1,"explanation":"An ion has a net electric charge. In this activity, ions are single atoms with unequal numbers of protons and electrons."},{"skill":"ions","question":"A positive ion is called a:","options":["Anion","Cation","Proton","Neutron"],"correct":1,"explanation":"A cation is a positive ion. A monatomic cation has fewer electrons than protons."},{"skill":"ions","question":"Metals typically form what type of ion?","options":["Negative ions (anions)","Positive ions (cations)","No ions","Neutral ions"],"correct":1,"explanation":"Metals LOSE electrons → become positive cations."},{"skill":"ions","question":"Chlorine (Group 17) gains 1 electron. What ion does it form?","options":["Cl⁺ (charge +1)","Cl⁻ (chloride, -1)","Cl²⁺ (charge +2)","Cl²⁻ (charge -2)"],"correct":1,"explanation":"Gaining 1 electron = -1 charge = Cl⁻ (chloride ion)."},{"skill":"ions","question":"Why does Sodium (Na) form a +1 ion instead of a -7 ion?","options":["Losing its one outer electron leaves the arrangement 2, 8","Sodium can't gain electrons","Sodium has no valence electrons","All metals must be +1"],"correct":0,"explanation":"Sodium commonly loses its one outer electron during reactions. Na⁺ has 11 protons and 10 electrons, arranged 2, 8. This gives sodium a full outer shell of 8 electrons."},{"skill":"ions","question":"An oxide ion (O²⁻) has 8 protons. How many electrons does it have?","options":["6","8","10","16"],"correct":2,"explanation":"O²⁻ means -2 charge. 8 protons + 2 extra electrons = 10 electrons."}];

const $=id=>document.getElementById(id);const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function charge(v){return v>0?'+'+v:v<0?'−'+Math.abs(v):'0';}
function shells(e){let left=e;return [2,8,8,2].map(cap=>{const n=Math.min(cap,left);left-=n;return n;});}
function atomView(a,custom){const el=ELEMENTS[a.p-1],sh=custom||shells(a.e),outer=sh.reduce((last,v,i)=>v?i:last,-1),net=a.p-a.e;let art='';const radii=[65,107,149,191];for(let i=0;i<4;i++){const active=sh[i]>0;art+=`<circle cx="230" cy="220" r="${radii[i]}" fill="none" stroke="${i===outer?'#81baa7':'#50727b'}" stroke-width="${i===outer?2:1}" ${active?'':'stroke-dasharray="3 6" opacity=".4"'}/>`;if(active)art+=`<text x="${230+radii[i]+5}" y="220" fill="#c3d9d9" font-size="12">${i+1}</text>`;for(let j=0;j<(sh[i]||0);j++){const angle=-Math.PI/2+j*2*Math.PI/sh[i];const x=230+Math.cos(angle)*radii[i],y=220+Math.sin(angle)*radii[i];art+=`<circle cx="${x}" cy="${y}" r="10" fill="#ffd079"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="14" font-weight="700" fill="#453314">−</text>`;}}

te.atom):`<div class="card tablecard"><span class="eyebrow">Notice what changes</span><p>${state.step===0?'The element depends only on the proton count.':state.step===1?'Neutrons change mass number, but not electric charge.':state.step===4||state.step===5?'Changing electrons affects charge, not element identity.':'The outermost occupied shell contains the valence electrons.'}</p></div>`}</div></div>`;}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

document.addEventListener('change',e=>{if(e.target.dataset.input)setParticle(e.target.dataset.scope,e.target.dataset.input,e.target.value);});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.mode){state.mode=d.mode;render(true);return;}if(d.step!==undefined){goStep(+d.step);return;}if(d.review!==undefined){goStep(+d.review);return;}if(d.mission!==undefined){goMission(+d.mission);return;}if(d.counter){const a=d.scope==='lesson'?state.atom:state.labAtom;setParticle(d.scope,d.counter,a[d.counter]+Number(d.delta));return;}if(d.element){const z=+d.element;const a={p:z,n:ELEMENTS[z-1][2]-z,e:z};if(state.mode==='learn'){state.atom=a;state.lessonFeedback='';}else{state.labAtom=a;state.labFeedback='';}render();announce(`${ELEMENTS[z-1][1]} selected. ${z} protons and ${z} electrons.`);return;}if(d.valence!==undefined||d.rule!==undefined){state.picked=+(d.valence??d.rule);state.lessonFeedback='';render();return;}if(d.answer!==undefined){if(!state.quiz.answers[state.quiz.index])state.quiz.selected=+d.answer;render();return;}if(d.shell!==undefined){if(!state.quiz.answers[state.quiz.index]){const i=+d.shell;state.quiz.placement[i]=Math.max(0,Math.min([2,8,8][i],state.quiz.placement[i]+Number(d.delta)));}render();return;}
switch(d.action){case'check-lesson':checkLesson();break;case'hint-lesson':state.lessonFeedback=LESSONS[state.step].hint;state.lessonGood=false;render();break;case'prev-lesson':if(state.step>0)goStep(state.step-1);break;case'next-lesson':if(!state.done.includes(state.step))break;if(state.step<6)goStep(state.step+1);else{state.mode='lab';render(true);}break;case'check-build':checkBuild();break;case'hint-build':state.labFeedback='Start with protons = atomic number. Then subtract protons from mass number to find neutrons. A positive ion has fewer electrons; a negative ion has extra electrons.';state.labGood=false;render();break;case'clear-build':state.labAtom={p:0,n:0,e:0};state.labFeedback='';render();break;case'neutral':state.labAtom.e=state.labAtom.p;render();break;case'prev-build':if(state.mission>0)goMission(state.mission-1);break;case'next-build':if(!state.builds.includes(state.mission))break;if(state.mission<4)goMission(state.mission+1);else{state.mode='quiz';render(true);}break;case'explore-mode':state.explore=true;state.labFeedback='';render();break;case'challenge-mode':state.explore=false;state.labFeedback='';render();break;case'start-quiz':startQuiz();break;case'new-quiz':state.quiz=null;render(true);break;case'submit-question':submitQuestion();break;case'next-question':if(!state.quiz.answers[state.quiz.index])break;state.quiz.index++;state.quiz.selected=null;state.quiz.placement=[0,0,0];if(state.quiz.index===12)state.quiz.finishedAt=new Date().toISOString();render(true);break;case'download-report':downloadReport();break;}
});
$('reset-progress').onclick=()=>$('reset-dialog').showModal();$('cancel-reset').onclick=()=>$('reset-dialog').close();$('confirm-reset').onclick=()=>{state=initial();$('reset-dialog').close();render(true);};render();
</script>
</body>
