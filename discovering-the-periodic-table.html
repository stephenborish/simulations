<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovering the Periodic Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #F4F5FA;
        --panel: #FFFFFF;
        --ink: #1D2233;
        --ink2: #4D5570;
        --ink3: #858CA5;
        --line: #E2E5EE;
        --accent: #4F46E5;
        --accent-ink: #3730A3;
        --accent-soft: #EEF0FF;
        --amber: #F59E0B;
        --stair: #E11D48;
        --cell: 62px;
        --gap: 4px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        font-family: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }
    b, strong { font-weight: 600; }
    .ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- App frame ---------- */
    .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
    .top {
        display: flex; align-items: center; gap: 18px;
        padding: 10px 20px; background: var(--panel);
        border-bottom: 1px solid var(--line); position: relative; z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 12px; flex: none; }
    .logo {
        width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff;
        display: grid; place-items: center; position: relative; font-weight: 700; font-size: 17px;
        box-shadow: 0 4px 12px rgba(79,70,229,.3);
    }
    .logo small { position: absolute; top: 3px; left: 5px; font-size: 8px; font-weight: 500; opacity: .8; }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    .brand p { margin: 1px 0 0; font-size: 12px; color: var(--ink3); }
    .steps { display: flex; gap: 4px; flex: 1; justify-content: flex-end; overflow-x: auto; scrollbar-width: none; }
    .steps::-webkit-scrollbar { display: none; }
    .stp {
        all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 7px; flex: none;
        height: 34px; padding: 0 6px; border-radius: 999px; cursor: pointer; color: var(--ink3);
        font-size: 13px; transition: background .2s;
    }
    .stp:hover { background: #F1F2F8; }
    .stp:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
    .stp .dot {
        width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
        background: #EDEFF6; color: var(--ink2); font-size: 12px; font-weight: 600; transition: all .25s;
    }
    .stp.done .dot { background: #DCF5E6; color: #1E8048; }
    .stp .lbl { display: none; white-space: nowrap; }
    .stp[aria-current="step"] { background: var(--accent-soft); color: var(--accent-ink); padding-right: 12px; }
    .stp[aria-current="step"] .dot { background: var(--accent); color: #fff; }
    .stp[aria-current="step"] .lbl { display: inline; font-weight: 600; }
    .progress { position: absolute; left: 0; bottom: -1px; height: 3px; background: var(--accent); border-radius: 0 3px 3px 0; transition: width .5s cubic-bezier(.2,.8,.2,1); }

    .main { display: grid; grid-template-columns: minmax(360px, 420px) 1fr; min-height: 0; }

    /* ---------- Lesson panel ---------- */
    .lesson { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); position: relative; z-index: 20; }
    .lesson-body { flex: 1; overflow-y: auto; padding: 24px 26px 32px; scroll-behavior: smooth; }
    .lesson-body > * + * { margin-top: 16px; }
    .eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
    .lesson h2 { font-size: 25px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin: 8px 0 0; }
    .lesson h3 { font-size: 15px; font-weight: 600; margin: 22px 0 0; }
    .lesson p { margin: 0; line-height: 1.6; color: var(--ink2); font-size: 15px; }
    .lesson p b { color: var(--ink); }
    .lead { font-size: 16px !important; }
    .fade-in { animation: fadeUp .4s ease-out both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .ws {
        display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
        background: #FFF3D1; color: #7A4F00; border: 1px solid #F3D27E; border-radius: 999px;
        padding: 3px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none;
    }
    .ws.sm { padding: 1px 8px; font-size: 11px; }
    .callout { border-radius: 14px; padding: 13px 15px; background: var(--accent-soft); border: 1px solid #DCE0FF; font-size: 14px; line-height: 1.55; color: var(--ink2); }
    .callout b { color: var(--ink); }
    .callout .h { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 4px; }
    .callout.ws-call { background: #FFFAEA; border-color: #F3D98F; }
    .callout.ws-call .h { color: #8A5A00; }
    .callout.soft { background: #F6F7FB; border-color: var(--line); }
    .callout.win { background: #ECFAF2; border-color: #A9E5C2; }
    .callout.win .h { color: #1E8048; }

    .goal { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink2); }
    .goal-bar { flex: 1; height: 6px; background: #EDEFF6; border-radius: 999px; overflow: hidden; }
    .goal-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s cubic-bezier(.2,.8,.2,1); }
    .goal.done .goal-bar i { background: #22A35A; }
    .goal.done { color: #1E8048; font-weight: 600; }

    .btn {
        all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer;
        transition: transform .12s, box-shadow .2s, background .2s; text-align: center;
    }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(79,70,229,.32); }
    .btn.primary:hover { background: #4338CA; }
    .btn.ghost { background: #EFF1F7; color: var(--ink); }
    .btn.ghost:hover { background: #E4E7F1; }
    .btn.lg { padding: 13px 22px; font-size: 15px; }
    .btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }
    .btn[disabled] { opacity: .4; pointer-events: none; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    /* Toggle cards ("paint" buttons) */
    .togs { display: grid; gap: 9px; }
    .tog {
        all: unset; box-sizing: border-box; display: flex; gap: 13px; align-items: center; width: 100%;
        padding: 11px 13px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; cursor: pointer;
        transition: border-color .2s, background .2s, transform .12s;
    }
    .tog:hover { border-color: var(--e); }
    .tog:active { transform: scale(.985); }
    .tog:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .tog .sw {
        width: 36px; height: 36px; border-radius: 10px; flex: none; border: 2px dashed var(--e);
        display: grid; place-items: center; color: var(--e); transition: background .25s;
    }
    .tog .sw .ic { opacity: 0; }
    .tog[aria-pressed="true"] { border-color: var(--e); background: color-mix(in srgb, var(--c) 28%, white); }
    .tog[aria-pressed="true"] .sw { background: var(--c); border-style: solid; color: var(--ink); }
    .tog[aria-pressed="true"] .sw .ic { opacity: 1; }
    .tog .t { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .tog .t small { font-weight: 500; font-size: 12px; color: var(--ink3); }
    .tog .d { font-size: 13px; color: var(--ink2); line-height: 1.45; margin-top: 2px; }

    /* Big hint cards for groups / periods */
    .axis-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .axis {
        all: unset; box-sizing: border-box; border-radius: 16px; padding: 14px; cursor: pointer; border: 2px solid transparent;
        transition: transform .12s, border-color .2s;
    }
    .axis:active { transform: scale(.98); }
    .axis:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .axis.g { background: #E8F1FF; color: #1E3A8A; }
    .axis.p { background: #FFEBEE; color: #9F1239; }
    .axis[aria-pressed="true"].g { border-color: #3B82F6; }
    .axis[aria-pressed="true"].p { border-color: #F43F5E; }
    .axis .pic { height: 54px; display: flex; gap: 4px; margin-bottom: 10px; }
    .axis.g .pic span { flex: 1; border-radius: 4px; background: currentColor; opacity: .25; }
    .axis.g .pic span:nth-child(2) { opacity: .7; animation: barY 2.4s ease-in-out infinite; }
    .axis.p .pic { flex-direction: column; }
    .axis.p .pic span { flex: 1; border-radius: 4px; background: currentColor; opacity: .25; }
    .axis.p .pic span:nth-child(2) { opacity: .7; animation: barX 2.4s ease-in-out infinite; }
    @keyframes barY { 0%,100% { transform: scaleY(.85); } 50% { transform: scaleY(1); } }
    @keyframes barX { 0%,100% { transform: scaleX(.92); } 50% { transform: scaleX(1); } }
    .axis b { display: block; font-size: 16px; }
    .axis span.s { display: block; font-size: 12.5px; line-height: 1.45; margin-top: 3px; opacity: .85; }

    /* Element square anatomy */
    .anatomy { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
    .big-tile {
        width: 150px; height: 150px; border-radius: 18px; background: #FFD99A; border: 2px solid #E3A33B;
        position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
        box-shadow: 0 10px 24px rgba(227,163,59,.28);
    }
    .hot {
        all: unset; cursor: pointer; border-radius: 8px; padding: 0 6px; transition: background .2s, box-shadow .2s;
        outline: 2px dashed transparent; outline-offset: 2px;
    }
    .hot:hover { background: rgba(255,255,255,.55); }
    .hot.on { background: #fff; box-shadow: 0 0 0 3px var(--accent); }
    .hot:focus-visible { outline-color: var(--accent); }
    .hot.unseen { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(79,70,229,.0); } 50% { box-shadow: 0 0 0 4px rgba(79,70,229,.35); } }
    .hot-num { position: absolute; top: 9px; left: 8px; font-size: 18px; font-weight: 600; }
    .hot-sym { font-size: 54px; font-weight: 700; line-height: 1.05; margin-top: 8px; }
    .hot-name { font-size: 14px; font-weight: 500; margin-top: 2px; }
    .anat-info { font-size: 14px; line-height: 1.55; color: var(--ink2); }
    .anat-info b.k { display: block; font-size: 16px; color: var(--ink); margin-bottom: 4px; }

    /* Valence chips */
    .vgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .vchip {
        all: unset; box-sizing: border-box; border-radius: 14px; border: 1.5px solid var(--line); padding: 10px 6px 9px;
        text-align: center; cursor: pointer; background: #fff; transition: all .2s;
    }
    .vchip:hover { border-color: var(--accent); }
    .vchip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .vchip .g { font-size: 11.5px; color: var(--ink3); font-weight: 600; }
    .vchip .v { font-size: 24px; font-weight: 700; color: var(--ink3); line-height: 1.25; }
    .vchip .dots { height: 8px; display: flex; gap: 3px; justify-content: center; margin-top: 2px; }
    .vchip .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
    .vchip.on { background: var(--accent-soft); border-color: #B9BEFB; }
    .vchip.on .v { color: var(--accent-ink); }
    .vchip.on .v.sm { font-size: 15px; line-height: 1.95; }
    .vchip.cur { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.18); }
    .vchip.wide { grid-column: span 1; }

    /* Diatomic */
    .seven {
        border-radius: 18px; padding: 18px; color: #fff;
        background: linear-gradient(135deg, #4F46E5, #6D28D9); box-shadow: 0 12px 28px rgba(79,70,229,.3);
        display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center;
    }
    .seven .big { font-size: 72px; font-weight: 800; line-height: .9; opacity: .95; }
    .seven p { color: #E0E2FF !important; font-size: 14px !important; }
    .seven p b { color: #fff !important; }
    .seven .btn { grid-column: 1 / -1; background: #fff; color: var(--accent-ink); }
    .pairs { display: flex; flex-wrap: wrap; gap: 8px; }
    .pair {
        min-width: 54px; padding: 8px 10px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 17px;
        border: 1.5px dashed #C9CDE0; color: var(--ink3); transition: all .3s;
    }
    .pair.on { border: 1.5px solid #3730A3; background: #6366F1; color: #fff; animation: pop .45s; }

    /* Detective + navigator */
    .field {
        display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 54px; border-radius: 14px;
        border: 2px solid var(--line); background: #fff; color: var(--ink3); transition: border-color .2s, box-shadow .2s;
    }
    .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,.14); color: var(--accent); }
    .field input { all: unset; flex: 1; font-size: 19px; font-weight: 500; color: var(--ink); min-width: 0; }
    .field input::placeholder { color: #A7ADC2; font-weight: 400; }
    .det-card { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: stretch; border: 1.5px solid var(--line); border-radius: 16px; padding: 12px; background: #fff; }
    .det-tile { border-radius: 12px; border: 2px solid var(--e); background: var(--c); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 96px; }
    .det-tile .n { position: absolute; top: 5px; left: 8px; font-size: 12px; font-weight: 500; }
    .det-tile .s { font-size: 36px; font-weight: 700; line-height: 1; }
    .det-rows { margin: 0; display: grid; gap: 6px; align-content: center; }
    .det-rows div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 5px; }
    .det-rows div:last-child { border-bottom: 0; padding-bottom: 0; }
    .det-rows dt { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 600; align-self: center; }
    .det-rows dd { margin: 0; font-weight: 600; font-size: 15px; text-align: right; }
    .why { font-size: 13px !important; }
    .warn { font-size: 13px; color: #9A3412; background: #FFF1E6; border: 1px solid #FCD3B4; border-radius: 10px; padding: 8px 11px; }
    .hist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink3); }
    .mini {
        all: unset; cursor: pointer; min-width: 30px; height: 30px; padding: 0 6px; box-sizing: border-box; border-radius: 8px;
        display: inline-grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--ink);
        background: var(--c, #fff); border: 1.5px solid var(--e, var(--line)); transition: transform .12s;
    }
    .mini:hover { transform: translateY(-2px); }
    .mini:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .filters label { display: grid; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; }
    .filters select {
        font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); text-transform: none; letter-spacing: 0;
        height: 46px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer;
    }
    .filters select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,.14); }
    .filters .full { grid-column: 1 / -1; }
    .typeseg { display: grid; grid-template-columns: .75fr 1fr 1.1fr 1.15fr; gap: 5px; }
    .typeseg button {
        all: unset; box-sizing: border-box; text-align: center; cursor: pointer; height: 42px; border-radius: 11px;
        border: 2px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--ink2); background: #fff; white-space: nowrap; padding: 0 4px;
        text-transform: none; letter-spacing: 0; display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .typeseg button i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); border: 1.5px solid var(--e); }
    .typeseg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
    .typeseg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .matches { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; background: #fff; }
    .matches .cnt { font-size: 13px; color: var(--ink2); margin-bottom: 8px; }
    .matches .cnt b { color: var(--ink); }

    /* Quick checks */
    .qc { border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 15px; background: #fff; }
    .qc .h { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); margin-bottom: 6px; }
    .qc .q { font-weight: 600; font-size: 15px; margin-bottom: 10px; line-height: 1.45; }
    .qc .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .qc .opt {
        all: unset; box-sizing: border-box; padding: 9px 14px; border-radius: 11px; border: 1.5px solid var(--line);
        cursor: pointer; font-size: 14px; font-weight: 500; transition: all .15s; background: #fff;
    }
    .qc .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
    .qc .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .qc .opt.right { background: #E6F8EE; border-color: #2FA563; color: #146238; }
    .qc .opt.wrong { background: #FDECEC; border-color: #E06464; color: #992B2B; animation: shake .35s; }
    .qc.solved .opt:not(.right) { opacity: .45; pointer-events: none; }
    .qc .fb { margin-top: 10px; font-size: 13.5px; line-height: 1.5; display: flex; gap: 8px; }
    .qc .fb.ok { color: #146238; }
    .qc .fb.no { color: #992B2B; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    /* Welcome */
    .howto { display: grid; gap: 8px; }
    .how { display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; border-radius: 14px; background: #F6F7FB; font-size: 14px; line-height: 1.5; color: var(--ink2); }
    .how b { color: var(--ink); }
    .how .e { font-size: 20px; line-height: 1.2; }
    .mission { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
    .mission button {
        all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 11px; padding: 8px 10px;
        border-radius: 12px; cursor: pointer; font-size: 14px; transition: background .15s;
    }
    .mission button:hover { background: #F3F4F9; }
    .mission button:focus-visible { outline: 3px solid var(--accent); }
    .mission .mi { width: 26px; height: 26px; border-radius: 50%; background: #EDEFF6; color: var(--ink2); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
    .mission .done .mi { background: #DCF5E6; color: #1E8048; }
    .mission .mt { flex: 1; font-weight: 500; }

    /* Review sheet */
    .sheet { border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; }
    .sheet div { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 10px 13px; font-size: 13.5px; line-height: 1.45; color: var(--ink2); }
    .sheet div + div { border-top: 1px solid var(--line); }
    .sheet dt, .sheet .k { font-weight: 600; color: var(--ink); }
    .score { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: linear-gradient(135deg, #ECFAF2, #EEF0FF); }
    .score .big { font-size: 34px; font-weight: 800; color: var(--accent-ink); }

    /* End-of-lesson bonus */
    .bonus {
        border-radius: 18px; padding: 16px; border: 2px solid #F3C74F;
        background: linear-gradient(160deg, #FFF8DC, #FFF 55%); box-shadow: 0 10px 28px rgba(227,163,59,.22);
        animation: bonusIn .6s cubic-bezier(.2,.8,.2,1) both;
    }
    .bonus > * + * { margin-top: 10px; }
    .bonus-h { font-size: 19px; font-weight: 700; }
    .bonus.locked { border: 1.5px dashed #C9CDE0; background: #F8F9FC; box-shadow: none; }
    .claim { display: grid; gap: 10px; }
    .claim label { display: grid; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; }
    .claim input {
        font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); text-transform: none; letter-spacing: 0;

<script>
/* =========================================================
   DATA
   Classification follows the class worksheet: three types only
   (metal, non-metal, noble gas). Elements along the staircase are
   grouped with the non-metals, except Al and Po (metals).
   ========================================================= */
const NONMETAL = new Set('H B C N O F Si P S Cl Ge As Se Br Sb Te I At'.split(' '));
const NOBLE = new Set('He Ne Ar Kr Xe Rn Og'.split(' '));
const DIATOMIC = ['H', 'N', 'O', 'F', 'Cl', 'Br', 'I'];
const SEVEN = ['N', 'O', 'F', 'Cl', 'Br', 'I'];
const ORIGIN = {
    Na: 'Latin “natrium”', K: 'Latin “kalium”', Fe: 'Latin “ferrum”', Cu: 'Latin “cuprum”',
    Ag: 'Latin “argentum”', Sn: 'Latin “stannum”', Sb: 'Latin “stibium”', Au: 'Latin “aurum”',
    Hg: 'Latin “hydrargyrum”', Pb: 'Latin “plumbum”', W: 'German “wolfram”'
};

const ELEMENTS = [];
function addRow(n, g, p, list, fBlock) {
    list.split(',').forEach((item, i) => {
        const [s, name] = item.trim().split(' ');
        ELEMENTS.push({
            n: n + i, s, name, p,
            g: fBlock ? null : g + i,
            f: !!fBlock, fi: fBlock ? i : null,
            cat: NOBLE.has(s) ? 'noble' : NONMETAL.has(s) ? 'nonmetal' : 'metal'
        });
    });
}
addRow(1, 1, 1, 'H Hydrogen');
addRow(2, 18, 1, 'He Helium');
addRow(3, 1, 2, 'Li Lithium,Be Beryllium');
addRow(5, 13, 2, 'B Boron,C Carbon,N Nitrogen,O Oxygen,F Fluorine,Ne Neon');
addRow(11, 1, 3, 'Na Sodium,Mg Magnesium');
addRow(13, 13, 3, 'Al Aluminum,Si Silicon,P Phosphorus,S Sulfur,Cl Chlorine,Ar Argon');
addRow(19, 1, 4, 'K Potassium,Ca Calcium,Sc Scandium,Ti Titanium,V Vanadium,Cr Chromium,Mn Manganese,Fe Iron,Co Cobalt,Ni Nickel,Cu Copper,Zn Zinc,Ga Gallium,Ge Germanium,As Arsenic,Se Selenium,Br Bromine,Kr Krypton');
addRow(37, 1, 5, 'Rb Rubidium,Sr Strontium,Y Yttrium,Zr Zirconium,Nb Niobium,Mo Molybdenum,Tc Technetium,Ru Ruthenium,Rh Rhodium,Pd Palladium,Ag Silver,Cd Cadmium,In Indium,Sn Tin,Sb Antimony,Te Tellurium,I Iodine,Xe Xenon');
addRow(55, 1, 6, 'Cs Cesium,Ba Barium');
addRow(57, 0, 6, 'La Lanthanum,Ce Cerium,Pr Praseodymium,Nd Neodymium,Pm Promethium,Sm Samarium,Eu Europium,Gd Gadolinium,Tb Terbium,Dy Dysprosium,Ho Holmium,Er Erbium,Tm Thulium,Yb Ytterbium,Lu Lutetium', true);
addRow(72, 4, 6, 'Hf Hafnium,Ta Tantalum,W Tungsten,Re Rhenium,Os Osmium,Ir Iridium,Pt Platinum,Au Gold,Hg Mercury,Tl Thallium,Pb Lead,Bi Bismuth,Po Polonium,At Astatine,Rn Radon');
addRow(87, 1, 7, 'Fr Francium,Ra Radium');
addRow(89, 0, 7, 'Ac Actinium,Th Thorium,Pa Protactinium,U Uranium,Np Neptunium,Pu Plutonium,Am Americium,Cm Curium,Bk Berkelium,Cf Californium,Es Einsteinium,Fm Fermium,Md Mendelevium,No Nobelium,Lr Lawrencium', true);
addRow(104, 4, 7, 'Rf Rutherfordium,Db Dubnium,Sg Seaborgium,Bh Bohrium,Hs Hassium,Mt Meitnerium,Ds Darmstadtium,Rg Roentgenium,Cn Copernicium,Nh Nihonium,Fl Flerovium,Mc Moscovium,Lv Livermorium,Ts Tennessine,Og Oganesson');
ELEMENTS.sort((a, b) => a.n - b.n);

const byN = {}, bySym = {}, byPos = {};
ELEMENTS.forEach(e => {
    byN[e.n] = e; bySym[e.s.toLowerCase()] = e;
    if (!e.f) byPos[`${e.p}-${e.g}`] = e;
});

const CAT = {
    metal:    { label: 'Metal',     plural: 'Metals',      c: '#FFD99A', e: '#E3A33B' },
    nonmetal: { label: 'Non-metal', plural: 'Non-metals',  c: '#B6EEC6', e: '#3DB56B' },
    noble:    { label: 'Noble gas', plural: 'Noble gases', c: '#D9C9FF', e: '#8E6BE8' }
};
const FAM = {
    alkali:     { label: 'Alkali metals',         one: 'Alkali metal',         where: 'Group 1 (not H)', fact: 'The most reactive metals. They fizz and even explode in water!', c: '#FFB4B4', e: '#E25C5C' },
    alkaline:   { label: 'Alkaline earth metals', one: 'Alkaline earth metal', where: 'Group 2',         fact: 'Reactive metals, but calmer than the alkali metals.',           c: '#FFD3A3', e: '#E08A3C' },
    transition: { label: 'Transition metals',     one: 'Transition metal',     where: 'Groups 3–12',     fact: 'The “classic” metals: iron, copper, silver, gold.',              c: '#BBDDFF', e: '#4C93DE' },
    halogen:    { label: 'Halogens',              one: 'Halogen',              where: 'Group 17',        fact: 'Very reactive non-metals. “Halogen” means “salt-maker.”',        c: '#B5EEE2', e: '#2FAE95' },
    noble:      { label: 'Noble gases',           one: 'Noble gas',            where: 'Group 18',        fact: 'Super stable. They almost never react with anything.',           c: '#D9C9FF', e: '#8E6BE8' }
};
const VAL_FILL = ['', '#EEF0FF', '#DDE1FF', '#C7CCFF', '#B0B6FF', '#9499F7', '#7A7EEC', '#6164DE', '#4B4CCB'];
const VAL_KEYS = ['1', '2', '3-12', '13', '14', '15', '16', '17', '18'];
const VAL_REP = { '1': 'Na', '2': 'Mg', '3-12': 'Fe', '13': 'Al', '14': 'Si', '15': 'P', '16': 'S', '17': 'Cl', '18': 'Ar' };

function valence(e) {
    if (e.f || (e.g >= 3 && e.g <= 12)) return null;
    if (e.s === 'He') return 2;
    return e.g <= 2 ? e.g : e.g - 10;
}
function valKey(e) { return (e.f || (e.g >= 3 && e.g <= 12)) ? '3-12' : String(e.g); }
function family(e) {
    if (e.f) return 'inner';
    if (e.g === 1) return e.s === 'H' ? null : 'alkali';
    if (e.g === 2) return 'alkaline';
    if (e.g <= 12 && e.g >= 3) return 'transition';
    if (e.g === 17) return 'halogen';
    if (e.g === 18) return 'noble';
    return null;
}
function shells(n) {
    const caps = [2, 8, 8, 8], out = [];
    let left = n;
    for (const c of caps) { if (left <= 0) break; out.push(Math.min(c, left)); left -= c; }
    return out;
}

/* =========================================================
   STATE
   ========================================================= */
const state = {

const STORE_KEY = 'ptable-lesson-v2';
const BONUS_KEY = 'ptable-bonus-claimed';
// Progress toward each step's goal is saved too, so a reload doesn't lock a student out of the finish
const SAVED_SETS = ['visited', 'catOn', 'famOn', 'valOn', 'diaOn', 'partsSeen', 'explored'];
function save() {
    try {
        const d = { step: state.step, flags: state.flags, checks: state.checks, history: state.det.history, traced: state.traced };
        SAVED_SETS.forEach(k => d[k] = [...state[k]]);
        localStorage.setItem(STORE_KEY, JSON.stringify(d));
    } catch (e) { /* storage unavailable: lesson still works */ }
}
function load() {
    // Kept under its own key so "Start over" doesn't let a student claim twice
    try {
        const b = JSON.parse(localStorage.getItem(BONUS_KEY) || 'null');
        if (b && b.name) state.bonusDone = b;
    } catch (e) { /* ignore */ }
    try {
        const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
        if (!d || !Number.isInteger(d.step) || d.step < 0 || d.step >= STEPS.length) return;
        state.step = d.step;
        SAVED_SETS.forEach(k => (d[k] || []).forEach(v => state[k].add(v)));
        if (d.flags) state.flags = d.flags;
        if (d.checks) state.checks = d.checks;
        if (Array.isArray(d.history)) state.det.history = d.history.filter(n => byN[n]);
        state.traced = !!d.traced;
    } catch (e) { /* ignore */ }
}

function qcHTML(id, label = 'Quick check') {
    const d = QC[id], st = state.checks[id] || { picked: [] };
    const solved = st.picked.some(i => d.o[i][1]);
    const last = st.picked[st.picked.length - 1];
    const fb = last == null ? '' :
        `<div class="fb ${d.o[last][1] ? 'ok' : 'no'}">${d.o[last][1] ? I.check : I.bulb}<span>${d.o[last][2]}</span></div>`;
    return `<div class="qc ${solved ? 'solved' : ''}" data-qc="${id}">
        <div class="h">${I.brain} ${label}</div>
        <div class="q">${d.q}</div>
        <div class="opts">${d.o.map((o, i) => {
            const cls = st.picked.includes(i) ? (o[1] ? 'right' : 'wrong') : '';
            return `<button class="opt ${cls}" data-act="qc" data-q="${id}" data-v="${i}">${o[0]}</button>`;
        }).join('')}</div>${fb}</div>`;
}
function answerQC(id, i) {
    const st = state.checks[id] || (state.checks[id] = { picked: [] });
    if (st.picked.some(k => QC[id].o[k][1]) || st.picked.includes(i)) return;
    st.picked.push(i);
    const node = document.querySelector(`[data-qc="${id}"]`);
    if (node) node.outerHTML = qcHTML(id, node.querySelector('.h').textContent.trim());
    if (STEPS[state.step].key === 'review') renderLesson();
    updateNav();
}

/* ---------- End-of-lesson bonus (extra credit form) ----------
   Shown only on the Review step, and only after every step's goal is met and the quiz is done.
   Nothing earlier in the lesson mentions it. */
/* Answers are posted straight to the Google Form's response endpoint through a hidden iframe,
   so students never see or get a link to the form itself. For Google to accept these posts the
   form must NOT require sign-in: turn off "Collect email addresses" and "Limit to 1 response".
   Field IDs come from the form's "Get pre-filled link". Leave an ID empty to skip that field. */
const BONUS = {
    action: 'https://docs.google.com/forms/d/e/1FAIpQLScdMNPw91p6_vSG7Q-4DrS0ASwEvCFG_vU1zrY7ogslEBy1_Q/formResponse',
    claim: { id: 'entry.967474911', value: 'YES!' },   // "Want two points extra credit?" (multiple choice)
    name: '',                                           // short answer: student's first & last name
    block: '',                                          // short answer: class block
    proof: ''                                           // short answer: completion summary (filled in automatically)
};
function unfinishedSteps() {
    return STEPS.map((s, i) => ({ s, i })).filter(({ s, i }) => {
        if (i === 0 || i === STEPS.length - 1) return false;
        if (!state.visited.has(i)) return true;
        if (!s.goal) return false;

    });
}
function bonusHTML() {
    const todo = unfinishedSteps();
    if (todo.length) {
        return `<div class="bonus locked fade-in">

            <p>It unlocks when you’ve finished <b>every</b> step. You still need to complete:</p>

        <div class="bonus-h">🎉 Bonus unlocked!</div>

            <div class="claim-err" id="claimErr" role="alert"></div>
            <button type="submit" class="btn primary lg" id="claimBtn">Claim my extra credit ${I.right}</button>
        </form>

    </div>`;
}
function proofText() {
    const ids = ['r1', 'r2', 'r3', 'r4', 'r5', 'r6'];
    const firstTry = ids.filter(id => { const p = (state.checks[id] || { picked: [] }).picked; return p.length && QC[id].o[p[0]][1]; }).length;
    return `All ${STEPS.length} steps done · quiz ${firstTry}/6 first try · ${new Date().toLocaleString()}`;
}
function submitClaim(ev) {
    ev.preventDefault();
    const name = $('#claimName').value.trim().replace(/\s+/g, ' ');
    const block = $('#claimBlock').value.trim();
    const err = $('#claimErr');
    if (name.split(' ').length < 2) { err.textContent = 'Please type your first AND last name.'; $('#claimName').focus(); return; }
    if (!block) { err.textContent = 'Please type your block.'; $('#claimBlock').focus(); return; }
    err.textContent = '';
    // Build a real form aimed at the hidden iframe: a plain cross-site POST, so no CORS issues
    const f = document.createElement('form');
    f.method = 'POST'; f.action = BONUS.action; f.target = 'bonusSink'; f.style.display = 'none';
    const add = (k, v) => { if (!k) return; const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i); };
    add(BONUS.claim.id, BONUS.claim.value);
    add(BONUS.name, name);
    add(BONUS.block, block);
    add(BONUS.proof, proofText());
    document.body.appendChild(f);
    const btn = $('#claimBtn');
    btn.disabled = true; btn.textContent = 'Sending…';
    let done = false;
    const finish = () => {
        if (done) return; done = true;
        f.remove();
        state.bonusDone = { name, block, at: new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) };
        try { localStorage.setItem(BONUS_KEY, JSON.stringify(state.bonusDone)); } catch (e) { /* ignore */ }
        renderLesson();
    };
    // Google's reply can't be read across origins, so treat the iframe loading (or a short wait) as sent
    $('#bonusSink').addEventListener('load', finish, { once: true });
    setTimeout(finish, 2500);
    f.submit();
}
document.addEventListener('submit', ev => { if (ev.target.id === 'claimForm') submitClaim(ev); });

/* =========================================================

const cells = [];
function buildTable() {
    const t = $('#ptable');
    let html = `<div class="axis-t g">Group (column) →</div><div class="axis-t p">Period (row) →</div>`;
    for (let g = 1; g <= 18; g++) html += `<button class="lab" data-act="group" data-v="${g}" style="grid-column:${g + 2};grid-row:2" aria-label="Spotlight group ${g}">${g}</button>`;
    for (let p = 1; p <= 7; p++) html += `<button class="lab" data-act="period" data-v="${p}" style="grid-column:2;grid-row:${p + 2}" aria-label="Spotlight period ${p}">${p}</button>`;
    html += `<div class="ph" style="grid-column:5;grid-row:8">57–71<br>↓</div><div class="ph" style="grid-column:5;grid-row:9">89–103<br>↓</div>`;
    html += `<div class="flab" style="grid-row:11">57–71<br>Lanthanides</div><div class="flab" style="grid-row:12">89–103<br>Actinides</div>`;
    html += `<div class="card" id="card" aria-live="polite"></div>`;
    t.innerHTML = html;

    ELEMENTS.forEach(e => {
        const b = document.createElement('button');
        b.className = 'el enter';
        b.dataset.n = e.n;
        b.style.gridColumn = e.f ? 5 + e.fi : e.g + 2;
        b.style.gridRow = e.f ? (e.p === 6 ? 11 : 12) : e.p + 2;
        b.style.setProperty('--in', ((e.f ? e.fi + 3 : e.g) * 18 + e.p * 28) + 'ms');
        b.setAttribute('aria-label', `${e.name}, ${e.s}, atomic number ${e.n}`);
        b.innerHTML = `<span class="num">${e.n}</span><span class="sym">${e.s}</span><span class="nm">${e.name}</span><span class="badge" hidden></span>`;
        b.addEventListener('animationend', ev => { if (ev.animationName === 'enter') b.classList.remove('enter'); if (ev.animationName === 'pop') b.classList.remove('pop'); });
        b.addEventListener('mouseenter', () => { state.hover = e.n; renderCard(); });
        b.addEventListener('mouseleave', () => { state.hover = null; renderCard(); });
        b.addEventListener('click', () => onElementClick(e));
        b.addEventListener('keydown', ev => arrowMove(ev, e));
        t.appendChild(b);
        cells.push({ e, node: b });
    });
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('overlay');
    svg.id = 'overlay';
    svg.innerHTML = '<path id="stairPath"/><path id="sevenPath"/>';
    t.appendChild(svg);
}

function cellNode(n) { return document.querySelector(`.el[data-n="${n}"]`); }

function drawOverlay() {
    const t = $('#ptable'), svg = $('#overlay');
    const W = t.offsetWidth, H = t.offsetHeight, gap = 4;
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const box = e => { const c = cellNode(e.n); return { l: c.offsetLeft, t: c.offsetTop, r: c.offsetLeft + c.offsetWidth, b: c.offsetTop + c.offsetHeight }; };
    const differs = (a, b) => a && b && a.cat !== 'noble' && b.cat !== 'noble' && (a.cat === 'metal') !== (b.cat === 'metal');
    let d = '';
    ELEMENTS.filter(e => !e.f && e.g >= 13 && e.g <= 17).forEach(e => {
        const A = box(e);
        const right = byPos[`${e.p}-${e.g + 1}`], below = byPos[`${e.p + 1}-${e.g}`];
        if (differs(e, right)) { const x = (A.r + box(right).l) / 2; d += `M${x} ${A.t - gap / 2}V${A.b + gap / 2}`; }
        if (differs(e, below)) { const y = (A.b + box(below).t) / 2; d += `M${A.l - gap / 2} ${y}H${A.r + gap / 2}`; }
    });
    $('#stairPath').setAttribute('d', d);
    const pts = SEVEN.map(s => { const B = box(bySym[s.toLowerCase()]); return `${(B.l + B.r) / 2} ${(B.t + B.b) / 2}`; });
    const seven = $('#sevenPath');
    seven.setAttribute('d', 'M' + pts.join('L'));
    const len = seven.getTotalLength();
    seven.style.strokeDasharray = len;
    if (!seven.classList.contains('show')) seven.style.strokeDashoffset = len;
}

function look(e) {
    const m = state.mode, full = state.full;
    if (m === 'category' && (full || state.catOn.has(e.cat))) return { c: CAT[e.cat].c, e: CAT[e.cat].e };
    if (m === 'family') {
        const f = family(e);
        if (f && f !== 'inner' && (full || state.famOn.has(f))) return { c: FAM[f].c, e: FAM[f].e };
    }
    if (m === 'valence' && (full || state.valOn.has(valKey(e)))) {
        const v = valence(e);
        if (v == null) return { c: '#ECEEF4', e: '#C5CAD6' };
        return { c: VAL_FILL[v], e: v >= 5 ? '#3B3BA8' : '#9DA2EE', t: v >= 5 ? '#fff' : '' };
    }
    if (m === 'diatomic' && DIATOMIC.includes(e.s) && (full || state.diaOn.has(e.s))) return { c: '#6366F1', e: '#312E81', t: '#fff' };
    if (m === 'bandG') return e.f ? { c: '#F1F5F9', e: '#CBD5E1' } : e.g % 2 ? { c: '#DBEAFE', e: '#93C5FD' } : { c: '#93C5FD', e: '#3B82F6' };
    if (m === 'bandP') return e.p % 2 ? { c: '#FFE4E6', e: '#FDA4AF' } : { c: '#FDA4AF', e: '#F43F5E' };
    return null;
}

function paint(wave) {
    cells.forEach(({ e, node }) => {
        const L = look(e);
        node.style.setProperty('--fill', L ? L.c : '#fff');
        node.style.setProperty('--edge', L ? L.e : '#D9DDE8');
        if (L && L.t) node.style.setProperty('--txt', L.t); else node.style.removeProperty('--txt');
        node.style.setProperty('--delay', wave ? ((e.f ? e.fi + 3 : e.g) * 24 + e.p * 14) + 'ms' : '0ms');
        node.classList.toggle('dim', !!state.focus && !state.focus.has(e.n));
        node.classList.toggle('sel', state.selected === e.n);
        const badge = node.querySelector('.badge'), v = valence(e);
        const showBadge = state.mode === 'valence' && v != null && (state.full || state.valOn.has(valKey(e)));
        badge.hidden = !showBadge;
        if (showBadge) badge.textContent = v;
    });
    document.querySelectorAll('.lab').forEach(l => {
        const key = (l.dataset.act === 'group' ? 'g' : 'p') + l.dataset.v;
        l.classList.toggle('on', state.focusLabel === key);
    });
    $('#ptable').classList.toggle('stair-strong', state.mode === 'category');
    $('#ptable').classList.toggle('dimmed-f', !!state.focus);
    const seven = $('#sevenPath');
    const showSeven = state.mode === 'diatomic' && (state.full || state.tracing || SEVEN.every(s => state.diaOn.has(s)));
    if (showSeven && !seven.classList.contains('show')) {
        seven.classList.add('show');
        seven.style.transition = 'none';
        seven.style.strokeDashoffset = 0;
    } else if (!showSeven && seven.classList.contains('show')) {
        seven.classList.remove('show');
        seven.style.transition = 'none';
        seven.style.strokeDashoffset = seven.getTotalLength();
    }
    renderToolbar();
    renderLegend();
    renderCard();
}

/* ---------- Detail card ---------- */
function bohrSVG(e) {
    const sh = shells(e.n), R = [30, 46, 62, 76];
    let g = `<circle cx="85" cy="85" r="18" fill="#EEF0FF" stroke="#C7CCFF" stroke-width="1.5"/>
             <text x="85" y="86" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#3730A3" font-family="Lexend, sans-serif">${e.s}</text>`;
    sh.forEach((count, i) => {
        const outer = i === sh.length - 1, r = R[i];
        g += `<circle cx="85" cy="85" r="${r}" fill="none" stroke="${outer ? '#F5C26B' : '#D5D9E6'}" stroke-width="${outer ? 2 : 1.4}" ${outer ? '' : 'stroke-dasharray="3 3"'}/>`;
        let dots = '';
        for (let k = 0; k < count; k++) {
            const a = (-90 + k * 360 / count + i * 17) * Math.PI / 180;
            dots += `<circle cx="${85 + r * Math.cos(a)}" cy="${85 + r * Math.sin(a)}" r="${outer ? 5 : 3.8}" fill="${outer ? '#F59E0B' : '#7A8299'}" stroke="#fff" stroke-width="1.2"/>`;
        }
        g += `<g class="spin" style="animation-duration:${24 + i * 10}s">${dots}</g>`;
    });
    return `<svg viewBox="0 0 170 170" role="img" aria-label="Bohr model of ${e.name}: ${sh.join(', ')} electrons by shell">${g}</svg>`;
}
function lewisSVG(e) {
    const v = valence(e), counts = [0, 0, 0, 0];
    if (e.s === 'He') counts[0] = 2; else for (let i = 0; i < v; i++) counts[i % 4]++;
    const c = 60, o = 9, near = 27, far = 93;
    const spots = [
        n => n === 1 ? [[c, near - 4]] : [[c - o, near - 4], [c + o, near - 4]],
        n => n === 1 ? [[far + 4, c]] : [[far + 4, c - o], [far + 4, c + o]],
        n => n === 1 ? [[c, far + 4]] : [[c - o, far + 4], [c + o, far + 4]],
        n => n === 1 ? [[near - 4, c]] : [[near - 4, c - o], [near - 4, c + o]]
    ];
    let dots = '';
    counts.forEach((n, side) => { if (n) spots[side](n).forEach(([x, y]) => dots += `<circle cx="${x}" cy="${y}" r="5" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>`); });
    return `<svg viewBox="0 0 120 120" role="img" aria-label="Electron dot diagram of ${e.name}: ${v} valence electrons">
        <text x="60" y="62" text-anchor="middle" dominant-baseline="middle" font-size="${e.s.length > 1 ? 36 : 42}" font-weight="700" fill="#1D2233" font-family="Lexend, sans-serif">${e.s}</text>${dots}</svg>`;
}
function renderCard() {
    const card = $('#card'), n = state.hover ?? state.selected;
    if (!n) {
        card.innerHTML = `<div class="card-empty"><span class="tap">👆</span><div><b>Tap any element</b> to see its details here.<br>
            <span style="font-size:13px">Tip: tap a number at the top (a group) or on the left (a period) to spotlight it.</span></div></div>`;
        return;
    }
    const e = byN[n], v = valence(e), f = family(e), C = CAT[e.cat];
    const famText = f === 'inner' ? (e.p === 6 ? 'Lanthanides' : 'Actinides') : f ? FAM[f].label : e.s === 'H' ? 'None (not alkali!)' : 'None of the 5';
    let fun = '';
    if (DIATOMIC.includes(e.s)) fun = `🔗 Diatomic: found in nature as <b>${e.s}${sub2}</b>`;
    else if (ORIGIN[e.s]) fun = `📜 The symbol ${e.s} comes from ${ORIGIN[e.s]}`;
    else if (e.s === 'He') fun = '⚠️ Helium is the Group 18 exception: only 2 valence electrons';
    let diagram;
    if (e.n <= 20) diagram = `${bohrSVG(e)}<div class="cap">Outer shell = <b>${v} valence e⁻</b></div>`;
    else if (v != null) diagram = `${lewisSVG(e)}<div class="cap">Dots = <b>${v} valence e⁻</b></div>`;
    else diagram = `<div class="varies"><div><b>?</b>${f === 'inner' ? 'Inner transition metal' : 'Transition metal'}:<br>valence electrons <b style="display:inline;font-size:inherit;color:var(--ink)">vary</b></div></div>`;

    card.innerHTML = `
        <div class="card-tile" style="--c:${C.c};--e:${C.e}"><span class="n">${e.n}</span><span class="s">${e.s}</span><span class="nm">${e.name}</span></div>
        <div class="facts">
            <h4>${e.name} <small>atomic # ${e.n} · ${e.n} proton${e.n > 1 ? 's' : ''}</small></h4>
            <div class="fgrid">
                ${e.f ? `<div class="fact"><span>Group</span><b>f-block</b></div>` : `<button class="fact" data-act="group" data-v="${e.g}"><span>Group</span><b>${e.g}</b></button>`}
                <button class="fact" data-act="period" data-v="${e.p}"><span>Period</span><b>${e.p}</b></button>
                <div class="fact"><span>Valence <span style="text-transform:none">e⁻</span></span><b>${v == null ? 'Varies' : v}</b></div>
                <div class="fact"><span>Type</span><b><i style="--c:${C.c};--e:${C.e}"></i>${C.label}</b></div>
                <div class="fact w2" title="${famText}"><span>Family</span><b>${famText}</b></div>
            </div>
            ${fun ? `<div class="fun">${fun}</div>` : ''}
        </div>
        <div class="diagram">${diagram}</div>`;
}

/* ---------- Toolbar & legend ---------- */
const MODES = [['plain', 'Plain'], ['category', 'Metal / Non-metal'], ['family', 'Families'], ['valence', 'Valence e⁻'], ['diatomic', 'Diatomic']];
function renderToolbar() {
    $('#modeSeg').innerHTML = MODES.map(([k, l]) => `<button data-act="mode" data-v="${k}" aria-pressed="${state.mode === k}">${l}</button>`).join('');
}
function renderLegend() {
    const L = $('#legend'), m = state.mode;
    const chip = (act, k, label, col, on) => `<button class="chip" data-act="${act}" data-v="${k}" aria-pressed="${on}" style="--c:${col.c};--e:${col.e}"><span class="sw"></span>${label}</button>`;

    if (m === 'category') L.innerHTML = Object.keys(CAT).map(k => chip('cat', k, CAT[k].plural, CAT[k], state.full || state.catOn.has(k))).join('') + stair;
    else if (m === 'family') L.innerHTML = Object.keys(FAM).map(k => chip('fam', k, FAM[k].label, FAM[k], state.full || state.famOn.has(k))).join('');
    else if (m === 'valence') L.innerHTML = `<span>Valence electrons:</span><span class="grad">${[1, 2, 3, 4, 5, 6, 7, 8].map(v => `<span style="background:${VAL_FILL[v]};color:${v >= 5 ? '#fff' : '#3730A3'}">${v}</span>`).join('')}</span>
        <span class="chip static" style="--c:#ECEEF4;--e:#C5CAD6"><span class="sw"></span>Varies (transition metals)</span>`;
    else if (m === 'diatomic') L.innerHTML = `<span class="chip static" style="--c:#6366F1;--e:#312E81"><span class="sw"></span>Diatomic elements: H, N, O, F, Cl, Br, I</span>`;
    else if (m === 'bandG') L.innerHTML = `<span><b>Groups</b> are the 18 <b>columns</b> ↓. Tap a number at the top to spotlight one.</span>`;
    else if (m === 'bandP') L.innerHTML = `<span><b>Periods</b> are the 7 <b>rows</b> →. Tap a number on the left to spotlight one.</span>`;
    else L.innerHTML = `<span>👆 Tap an element for details · Tap a group or period number to spotlight it · Pick a “Color by” view to explore</span>`;
}

/* ---------- Fit table to the available space ---------- */
const stacked = window.matchMedia('(max-width: 1023px)');
function fitTable() {
    const area = $('#tableArea'), t = $('#ptable');
    const natW = t.offsetWidth, natH = t.offsetHeight;
    const cs = getComputedStyle(area);
    const availW = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let s = availW / natW;
    if (stacked.matches) s = Math.max(.55, Math.min(1, s));
    else s = Math.max(.3, Math.min(1.25, s, availH / natH));
    $('#tableScale').style.transform = `scale(${s})`;
    $('#sizer').style.width = natW * s + 'px';
    $('#sizer').style.height = natH * s + 'px';
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
function setMode(m, full = false) { state.mode = m; state.full = full; }
function setFocus(set, label = null) { state.focus = set; state.focusLabel = label; }
function select(n) { state.selected = n; }

function onElementClick(e) {
    state.selected = e.n;
    if (STEPS[state.step].key === 'square' && e.n !== 20 && !state.explored.has(e.n)) {
        state.explored.add(e.n);
        renderLesson();
    }
    if (state.focus && !state.focus.has(e.n)) setFocus(null);
    paint();
}

function spotlight(kind, v) {
    const key = kind + v;
    if (state.focusLabel === key) { setFocus(null); paint(); return; }
    const set = new Set(ELEMENTS.filter(e => kind === 'g' ? e.g === +v : e.p === +v).map(e => e.n));
    setFocus(set, key);
    state.flags[kind] = true;
    if (STEPS[state.step].key === 'gp') renderLesson();
    paint();
}

function popCells(ns, stagger = 0) {
    ns.forEach((n, i) => setTimeout(() => {
        const c = cellNode(n);
        if (!c) return;
        c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    }, i * stagger));
}

let diaTimers = [];
function traceSeven() {
    diaTimers.forEach(clearTimeout); diaTimers = [];
    state.diaOn.clear(); state.traced = true; state.tracing = true;
    setMode('diatomic'); setFocus(null);
    const seven = $('#sevenPath'), len = seven.getTotalLength();
    seven.classList.add('show');
    seven.style.transition = 'none';
    seven.style.strokeDashoffset = len;
    paint(); renderLesson();
    void seven.getBoundingClientRect();
    seven.style.transition = 'stroke-dashoffset 2.4s ease-in-out, opacity .3s';
    seven.style.strokeDashoffset = 0;
    SEVEN.forEach((s, i) => diaTimers.push(setTimeout(() => {
        state.diaOn.add(s); paint(); renderLesson(); updateNav(); popCells([bySym[s.toLowerCase()].n]);
    }, 150 + i * 430)));
    diaTimers.push(setTimeout(() => {
        state.tracing = false;
        state.diaOn.add('H'); select(1);
        paint(); renderLesson(); popCells([1]);
    }, 150 + SEVEN.length * 430 + 500));
}

/* ---------- Detective ---------- */
function detFind(q) {
    q = q.trim();
    if (!q) return null;
    const exact = bySym[q.toLowerCase()];
    if (exact) return exact;
    if (q.length >= 3) return ELEMENTS.find(e => e.name.toLowerCase().startsWith(q.toLowerCase())) || null;
    return null;
}
let detTimer = null;
function detSearch(q, now) {
    state.det.q = q;
    const e = detFind(q);
    clearTimeout(detTimer);
    if (e) {
        select(e.n); setFocus(new Set([e.n]));
        popCells([e.n]);
        // Only log an element once the student stops typing, so "C" on the way to "Ca" isn't counted
        const log = () => {
            const h = state.det.history;
            if (!h.includes(e.n)) { h.push(e.n); if (h.length > 12) h.shift(); }
            const r = $('#detResult');
            if (r) r.innerHTML = detResultHTML();
            updateGoal(); updateNav();
        };
        if (now) log(); else detTimer = setTimeout(log, 900);
    } else if (!q.trim()) { setFocus(null); }
    $('#detResult').innerHTML = detResultHTML();
    paint();
}
function detResultHTML() {
    const q = (state.det.q || '').trim(), e = detFind(q);
    let out = '';
    if (q && !e) {
        out += `<div class="warn">🤔 No element matches “${esc(q)}”. Check the spelling, or try just the symbol (1–2 letters).</div>`;
    } else if (e) {
        const v = valence(e), C = CAT[e.cat], f = family(e);
        const caseWarn = q.length === e.s.length && q !== e.s && q.toLowerCase() === e.s.toLowerCase() && e.s.length === 2
            ? `<div class="warn">✍️ Careful when you write it: it’s <b>${e.s}</b>, not “${esc(q)}”. Second letter lowercase!</div>` : '';
        const why = [];
        why.push(e.f ? `It’s in the f-block (period ${e.p}).` : `It’s in <b>Group ${e.g}</b>, <b>Period ${e.p}</b>.`);
        if (e.s === 'H') why.push('Hydrogen is the special one: a non-metal on the left side.');
        else if (e.cat === 'noble') why.push('Group 18 means noble gas.');
        else why.push(e.cat === 'metal' ? 'It’s left of the staircase, so it’s a metal.' : 'It’s right of the staircase, so it’s a non-metal.');
        if (v == null) why.push(`${f === 'inner' ? 'Inner transition' : 'Transition'} metals’ valence electrons vary.`);
        else if (e.s === 'He') why.push('Helium is the exception: 2 valence electrons.');
        else why.push(e.g <= 2 ? `Group ${e.g} means ${v} valence electron${v > 1 ? 's' : ''}.` : `Group ${e.g}: drop the 1, so ${v} valence electrons.`);
        out += `${caseWarn}<div class="det-card fade-in">
            <div class="det-tile" style="--c:${C.c};--e:${C.e}"><span class="n">${e.n}</span><span class="s">${e.s}</span></div>
            <dl class="det-rows">
                <div><dt>Name</dt><dd>${e.name}</dd></div>
                <div><dt>Classify</dt><dd>${C.label}</dd></div>
                <div><dt>Valence <span style="text-transform:none">e⁻</span></dt><dd>${v == null ? 'Varies' : v}</dd></div>
            </dl></div>
            <p class="why"><b>How we know:</b> ${why.join(' ')}</p>`;
    }
    const h = state.det.history;
    if (h.length) out += `<div class="hist" style="margin-top:12px">Found so far: ${h.map(n => { const x = byN[n]; return `<button class="mini" data-act="detPick" data-v="${x.s}" style="--c:${CAT[x.cat].c};--e:${CAT[x.cat].e}">${x.s}</button>`; }).join('')}</div>`;
    return out;
}

/* ---------- Navigator ---------- */
function navMatches() {
    const { g, p, t } = state.nav;
    if (g === 'any' && p === 'any' && t === 'any') return null;
    return ELEMENTS.filter(e => (g === 'any' || e.g === +g) && (p === 'any' || e.p === +p) && (t === 'any' || e.cat === t));
}
function navResultHTML() {
    const m = navMatches();
    if (!m) return `<div class="matches"><div class="cnt">Choose a group, period, or type to start the search.</div></div>`;
    const { g, p, t } = state.nav;
    const desc = [t !== 'any' ? `<b>${CAT[t].label.toLowerCase()}s</b>` : '<b>elements</b>', g !== 'any' ? `in <b>Group ${g}</b>` : '', p !== 'any' ? `in <b>Period ${p}</b>` : ''].filter(Boolean).join(' ');
    if (!m.length) return `<div class="matches"><div class="cnt">No ${desc}. Try changing one of the clues.</div></div>`;
    return `<div class="matches fade-in"><div class="cnt"><b>${m.length}</b> ${desc}${m.length > 1 ? '. Any one is a correct answer!' : ''}</div>
        <div class="hist">${m.slice(0, 40).map(x => `<button class="mini" data-act="pick" data-v="${x.n}" style="--c:${CAT[x.cat].c};--e:${CAT[x.cat].e}" title="${x.name}">${x.s}</button>`).join('')}${m.length > 40 ? '…' : ''}</div></div>`;
}
function applyNav() {
    const m = navMatches();
    setFocus(m ? new Set(m.map(e => e.n)) : null);
    if (m && m.length && !m.some(e => e.n === state.selected)) select(m[0].n);
    const r = $('#navResult');
    if (r) r.innerHTML = navResultHTML();
    document.querySelectorAll('[data-act="navT"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.nav.t));
    paint();
}

/* ---------- Keyboard: arrows move around the table ---------- */
function arrowMove(ev, e) {
    const d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[ev.key];
    if (!d) return;
    ev.preventDefault(); ev.stopPropagation();
    let row = e.f ? (e.p === 6 ? 9 : 10) : e.p, col = e.f ? e.fi + 3 : e.g;
    const at = (r, c) => r <= 7 ? byPos[`${r}-${c}`] : ELEMENTS.find(x => x.f && (x.p === (r === 9 ? 6 : 7)) && x.fi + 3 === c);
    for (let k = 0; k < 20; k++) {
        row += d[0]; col += d[1];
        if (row === 8) row += d[0];
        if (row < 1 || row > 10 || col < 1 || col > 18) return;
        const x = at(row, col);
        if (x) { cellNode(x.n).focus(); state.hover = x.n; renderCard(); return; }
    }
}

/* ---------- Lesson rendering & navigation ---------- */
function renderStepper() {
    $('#stepper').innerHTML = STEPS.map((s, i) => `<button class="stp ${state.visited.has(i) && i !== state.step ? 'done' : ''}" data-act="goto" data-v="${i}" ${i === state.step ? 'aria-current="step"' : ''} title="${s.title}">
        <span class="dot">${state.visited.has(i) && i !== state.step ? I.check : i + 1}</span><span class="lbl">${s.short}</span></button>`).join('');
    $('#progress').style.width = ((state.step) / (STEPS.length - 1) * 100) + '%';
    const cur = $('#stepper [aria-current]');
    if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function goalHTML() {
    const s = STEPS[state.step];
    if (!s.goal) return '';
    const [d, t, txt] = s.goal();
    return `<div id="goalSlot">${goalBar(d, t, txt)}</div>`;
}
function updateGoal() {
    const slot = $('#goalSlot'), s = STEPS[state.step];
    if (slot && s.goal) { const [d, t, txt] = s.goal(); slot.innerHTML = goalBar(d, t, txt); }
}
function renderLesson() {
    const body = $('#lesson'), s = STEPS[state.step], top = body.scrollTop;
    body.innerHTML = `
        <div class="eyebrow"><span>Step ${state.step + 1} of ${STEPS.length}</span>${s.ws ? `<span class="ws">✏️ Worksheet ${s.ws}</span>` : ''}</div>
        <h2>${s.title}</h2>
        ${goalHTML()}
        ${s.render()}`;
    body.scrollTop = top;
    if (s.after) s.after();
    updateNav();
}
function updateNav() {
    const i = state.step, last = i === STEPS.length - 1, s = STEPS[i];
    $('#prevBtn').disabled = i === 0;
    const nb = $('#nextBtn');
    nb.style.visibility = last ? 'hidden' : '';
    if (!last) nb.innerHTML = `<span class="l1">${i === 0 ? 'Start' : 'Next'} ${I.right}</span><span class="l2">${STEPS[i + 1].title}</span>`;
    let done = false;
    if (s.goal) { const [d, t] = s.goal(); done = d >= t; }
    nb.classList.toggle('glow', done && !last);
    save();
}
function goTo(i) {
    if (i < 0 || i >= STEPS.length) return;
    diaTimers.forEach(clearTimeout); diaTimers = []; state.tracing = false;
    clearTimeout(detTimer);
    state.step = i; state.visited.add(i);
    // Start each step with a clean table; a step's enter() can still select its own element (e.g. Ca)
    setFocus(null); state.selected = null; state.hover = null; state.part = null;
    STEPS[i].enter();
    $('#lesson').scrollTop = 0;
    renderLesson(); renderStepper();
    paint(true);
    save();
    if (stacked.matches) document.querySelector('.stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- Click delegation ---------- */
document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act, v = t.dataset.v;
    switch (act) {
        case 'next': goTo(state.step + 1); break;
        case 'prev': goTo(state.step - 1); break;
        case 'goto': goTo(+v); break;
        case 'group': spotlight('g', v); break;
        case 'period': spotlight('p', v); break;
        case 'bands': {
            const m = 'band' + v;
            setMode(state.mode === m ? 'plain' : m); setFocus(null);
            state.flags[v === 'G' ? 'g' : 'p'] = true;
            renderLesson(); paint(true); break;
        }
        case 'part': state.part = v; state.partsSeen.add(v); renderLesson(); break;
        case 'cat': case 'fam': {
            const set = act === 'cat' ? state.catOn : state.famOn, mode = act === 'cat' ? 'category' : 'family';
            // Coming from the full-color view every chip shows as on, so start from "all on" before toggling
            const wasFull = state.mode === mode && state.full;
            if (state.mode !== mode || state.full) setMode(mode);
            if (wasFull) { set.clear(); Object.keys(act === 'cat' ? CAT : FAM).forEach(k => set.add(k)); }
            set.has(v) ? set.delete(v) : set.add(v);
            setFocus(null);
            paint(true); renderLesson();
            if (set.has(v)) popCells(ELEMENTS.filter(e => act === 'cat' ? e.cat === v : family(e) === v).slice(0, 1).map(e => e.n));
            break;
        }
        case 'catAll': setMode('category'); ['metal', 'nonmetal', 'noble'].forEach(k => state.catOn.add(k)); paint(true); renderLesson(); break;
        case 'famAll': setMode('family'); Object.keys(FAM).forEach(k => state.famOn.add(k)); paint(true); renderLesson(); break;
        case 'val': {
            setMode('valence'); state.valOn.add(v); state.lastVal = v;
            const set = new Set(ELEMENTS.filter(e => valKey(e) === v && (v !== '3-12' || !e.f)).map(e => e.n));
            setFocus(set);
            select(bySym[VAL_REP[v].toLowerCase()].n);
            paint(true); renderLesson();
            break;
        }
        case 'valAll': setMode('valence'); VAL_KEYS.forEach(k => state.valOn.add(k)); setFocus(null); paint(true); renderLesson(); break;
        case 'dia': traceSeven(); break;
        case 'mode': setMode(v, true); setFocus(null); paint(true); if (['gp'].includes(STEPS[state.step].key)) renderLesson(); break;
        case 'clear': setFocus(null); state.selected = null; if (state.mode.startsWith('band')) setMode('plain'); paint(); break;
        case 'qc': answerQC(t.dataset.q, +v); break;
        case 'detPick': $('#detInput').value = v; detSearch(v, true); break;
        case 'pick': select(+v); paint(); break;
        case 'navT': state.nav.t = v; applyNav(); break;
        case 'navEx': state.nav = { g: '14', p: 'any', t: 'metal' }; $('#fG').value = '14'; $('#fP').value = 'any'; applyNav(); break;
        case 'navReset': state.nav = { g: 'any', p: 'any', t: 'any' }; $('#fG').value = 'any'; $('#fP').value = 'any'; applyNav(); break;
        case 'reset':
            try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
            location.reload(); break;
    }
    if (['cat', 'fam', 'val', 'valAll', 'catAll', 'famAll', 'part', 'bands'].includes(act)) updateNav();
});

document.addEventListener('keydown', ev => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (['input', 'select', 'textarea'].includes(tag) || ev.target.classList.contains('el')) return;
    if (ev.key === 'ArrowRight') goTo(state.step + 1);
    if (ev.key === 'ArrowLeft') goTo(state.step - 1);
    if (ev.key === 'Escape') { setFocus(null); state.selected = null; paint(); }
});
$('#namesToggle').addEventListener('change', ev => $('#ptable').classList.toggle('hide-names', !ev.target.checked));

/* =========================================================
   INIT
   ========================================================= */
function init() {
    load();
    buildTable();
    STEPS[state.step].enter();
    renderStepper();
    renderLesson();
    paint();
    fitTable();
    drawOverlay();
    new ResizeObserver(() => { fitTable(); }).observe($('#tableArea'));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitTable(); drawOverlay(); });
}
init();
</script>
</body>
